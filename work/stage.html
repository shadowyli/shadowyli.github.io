<style>
    /* 舞美模块：一大 + 其余小；相邻模块的大图左右交替，保持原比例并等高 */
    .stage-media-grid {
      display: grid;
      gap: 6px;
      align-items: start;
      grid-template-columns: var(--stage-large-col) minmax(0, 1fr);
    }

    .stage-module[data-stage-side="right"] .stage-media-grid {
      grid-template-columns: minmax(0, 1fr) var(--stage-large-col);
    }

    .stage-module[data-stage-side="left"] .stage-media-main { grid-column: 1; grid-row: 1; }
    .stage-module[data-stage-side="left"] .stage-media-side { grid-column: 2; grid-row: 1; }
    .stage-module[data-stage-side="right"] .stage-media-main { grid-column: 2; grid-row: 1; }
    .stage-module[data-stage-side="right"] .stage-media-side { grid-column: 1; grid-row: 1; }

    .stage-media-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stage-media-grid figure {
      margin: 0;
    }

    /* 抵消全局相邻 figure 的 6px 上边距，避免右侧第二张被顶下去 */
    .stage-media-grid .case-frame + .case-frame { margin-top: 0; }

    .stage-media-grid img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 大图列宽按各模块原图比例反推，保证与右侧两小图总高严格相等 */
    .stage-ratio-neck { --stage-large-col: calc(68.24% + 0.76px); }
    .stage-ratio-eggy { --stage-large-col: calc(66.6667% + 0.74px); }
    .stage-ratio-mengshou { --stage-large-col: calc(66.6667% - 0.44px); }

    @media (max-width: 720px) {
      .stage-media-grid { grid-template-columns: 1fr; }

      .stage-media-main,
      .stage-media-side { grid-column: 1; grid-row: auto; }

      .stage-media-side { flex-direction: row; }
      .stage-media-side figure { flex: 1 1 0; }
    }

    /* 序言：胶囊 + 署名排成一行（与站内其他案例页保持一致） */
    .case-body .voice {
      position: relative;
      display: block;
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: clamp(14px, 1.6vw, 20px) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    }

    .voice-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(12px, 1.5vw, 20px);
      padding: 0;
      min-height: 26px;
    }

    .case-body .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: none;
      flex: none;
      margin: 0;
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .voice-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .voice-author {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.1vw, 13px);
      min-height: 26px;
    }

    .voice-rule {
      display: block;
      flex: none;
      width: 22px;
      height: 1px;
      margin: 0;
      background: color-mix(in srgb, var(--text) 45%, transparent);
    }

    .case-body .voice-name {
      margin: 0;
      max-width: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .case-body .voice-role {
      margin: 0;
      max-width: none;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.2;
    }

    @media (max-width: 720px) {
      .case-body .voice { padding: 16px 0; }
    }

    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    /* 标题与图之间只留一点呼吸，不沿用区块之间的默认大间距 */
    .case-gallery > h2 { margin-bottom: clamp(16px, 1.6vw, 22px); }

    /* 2、3 两张舞台图并排一行；首图单独通栏 */
    .case-gallery .case-row + .case-row { margin-top: 6px; }

    .case-gallery .case-row[data-layout="secondary"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .case-gallery .case-row[data-layout="secondary"] > .case-frame { margin: 0; }

    .case-gallery .case-row[data-layout="secondary"] .case-frame--image img {
      width: 100%;
      height: auto;
    }

    /* 02 的 16:9 画框槽位：虚线框标明可替换区域 */
    .case-gallery .case-placeholder-frame .case-frame-inner {
      border: 1px dashed color-mix(in srgb, var(--text) 16%, transparent);
      background: color-mix(in srgb, var(--surface) 55%, transparent);
    }

    /* 空白页内容较短：桌面端让页脚始终落在视口底部 */
    @media (min-width: 721px) {
      body.case-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .case-main { flex: 1; }
    }

    /* 设计的回声：通栏 WebGL 展示带，中间最宽、两侧渐窄，左右边缘渐隐到底色 */
    .social-badge--long {
      white-space: normal;
      font-size: 12.5px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 6px;
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-align: center;
    }

    :root[data-theme="light"] .case-body .social-sign { color: var(--text); }

    .echo-reel {
      position: relative;
      width: 100vw;
      height: clamp(190px, 19vw, 280px);
      margin: 0 0 0 calc(50% - 50vw);
      outline: none;
    }

    .echo-reel:focus-visible .echo-canvas {
      outline: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
      outline-offset: -4px;
    }

    .echo-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: grab;
      touch-action: pan-y;
      transition: opacity 700ms ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .echo-reel.is-gl .echo-canvas { opacity: 1; }
    .echo-reel.is-dragging .echo-canvas { cursor: grabbing; }

    .echo-list {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 max(20px, calc(50vw - 496px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .echo-list::-webkit-scrollbar { display: none; }

    .echo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: none;
      height: 97%;
      margin: 0;
      scroll-snap-align: center;
    }

    .echo-card img {
      display: block;
      width: auto;
      height: calc(100% - 31px);
      max-height: calc(100% - 31px);
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 5px;
    }

    .echo-card .social-badge {
      position: static;
      order: -1;
      align-self: flex-start;
      max-width: 100%;
      margin: 0 0 6px;
      border-color: rgba(255, 255, 255, .48);
      background: rgba(8, 7, 10, .94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      padding: 5px 11px;
      white-space: normal;
    }

    /* WebGL 接管后，DOM 列表只留给读屏与搜索引擎 */
    .echo-reel.is-gl .echo-list {
      inset: auto;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .echo-reel { height: clamp(180px, 52vw, 240px); }
      .echo-canvas {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
    }
  </style>

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();
  </script>
  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", closeDialog);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>

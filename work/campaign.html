  <style>
    .case-body .case-pair + .case-frame {
      margin-top: 6px;
    }

    /* 排版规则：① 同一游戏相邻 ② 竖版 2–3 张一行、禁止竖版独占整行 ③ 竖版凑不齐行时与横版并排 ④ 横版主要单独一行、次要两张一行 ⑤ 4 张以上竖版并成一条系列条 ⑥ 尽量避免同样张数的行相邻 ⑦ 手机端同样禁止竖版单独一行（横竖并排的行在手机上也保持并排） */
    .case-gallery { display: block; }

    .case-row { margin: 0; }

    .case-row + .case-row { margin-top: 6px; }

    .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame + .case-frame { margin-top: 0; }

    /* 竖版行：至少 2 张、按张数等分铺满，禁止竖版单张独占一行 */
    .case-row[data-layout="portrait"] {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 6px;
    }

    /* 系列条：4 张以上竖版并成一条，避免同样张数的行紧挨着出现 */
    .case-row[data-layout="strip"] {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    /* 横版 + 竖版并排：横版保形（3:1 分栏，裁切仅 ~5%），竖版因此不独占一行 */
    .case-row[data-layout="duo"] {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 6px;
    }

    .case-row[data-layout="duo"] > .case-frame { min-height: 0; }

    .case-row[data-layout="duo"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .case-row[data-layout="secondary"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .social-badge--long {
      white-space: nowrap;
      font-size: 10px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 clamp(10px, 1.2vw, 16px);
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 720px) {
      /* 手机端竖版行等分，不留通栏的单张 */
      .case-row[data-layout="portrait"] { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
      /* 横版 + 竖版改为上下排列，避免竖版被压到无法辨认 */
      .case-row[data-layout="strip"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* 序言：胶囊 + 署名排成一行 */
    .case-body .voice {
      position: relative;
      display: block;
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: clamp(14px, 1.6vw, 20px) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    }

    .voice-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(12px, 1.5vw, 20px);
      padding: 0;
    }

    .case-body .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: none;
      flex: none;
      margin: 0;
      padding: 3px 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .voice-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .voice-author {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.1vw, 13px);
      min-height: 20px;
    }

    .voice-rule {
      display: block;
      flex: none;
      width: 22px;
      height: 1px;
      margin: 0;
      background: color-mix(in srgb, var(--text) 45%, transparent);
    }

    .case-body .voice-name {
      margin: 0;
      max-width: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .case-body .voice-role {
      margin: 0;
      max-width: none;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.2;
    }

    @media (max-width: 720px) {
      .case-body .voice { padding: 16px 0; }
    }

    /* 底部收口：分割线、查看更多、回声区之间的留白压到最小可用值 */
    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    .case-body .case-related-divider { margin: 32px 0 0; }

    .case-body .case-related { margin-top: 22px; }

    .case-body .case-related-grid { margin-top: 0; }

    .case-body .globe-close {
      margin-top: clamp(14px, 1.8vw, 22px);
    }

    /* 查看更多：展开式画廊——悬停 / 聚焦的一张展开，其余收成窄条 */
    .more-gallery {
      --more-grow: 2.36;
      display: flex;
      gap: 6px;
      height: clamp(104px, 12vw, 152px);
    }

    .more-item.is-active { flex-grow: var(--more-grow); }

    .more-item {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      border-radius: 6px;
      background: var(--surface);
      color: #ffffff;
      text-decoration: none;
      transition: flex-grow 520ms cubic-bezier(.22, .8, .24, 1);
    }

    .more-item img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.5) saturate(.75);
      transform: scale(1.06);
      transition: filter 420ms ease, transform 800ms cubic-bezier(.22, .8, .24, 1);
    }

    .more-item.is-active img { filter: none; transform: scale(1); }

    .more-item::after {
      position: absolute;
      inset: 30% 0 0;
      background: linear-gradient(to top, rgba(8, 7, 10, .82), transparent);
      content: "";
      opacity: 0;
      transition: opacity 360ms ease;
    }

    .more-item.is-active::after { opacity: 1; }

    .more-label {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 11px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 240ms ease, transform 360ms ease;
    }

    .more-item.is-active .more-label {
      opacity: 1;
      transform: none;
      transition-delay: 180ms;
    }

    .more-label > span:first-child { min-width: 0; }
    .more-arrow { flex: none; transition: transform 240ms ease; }
    .more-item.is-active:hover .more-arrow { transform: translateX(4px); }

    .more-item:focus-visible {
      outline: 1px solid color-mix(in srgb, var(--text) 60%, transparent);
      outline-offset: 3px;
    }

    @media (max-width: 720px) {
      .more-gallery { height: 88px; gap: 4px; }
      .more-item { border-radius: 4px; }
      .more-label { left: 10px; right: 10px; bottom: 8px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .more-item, .more-item img, .more-label { transition: none; }
    }

    /* 回声：通栏 WebGL 展示带，中间最宽、两侧渐窄，左右边缘渐隐到底色 */
    .echo-reel {
      position: relative;
      width: 100vw;
      height: clamp(170px, 18vw, 260px);
      margin: clamp(6px, 1vw, 12px) 0 0 calc(50% - 50vw);
      outline: none;
    }

    .echo-reel:focus-visible .echo-canvas {
      outline: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
      outline-offset: -4px;
    }

    .echo-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: grab;
      touch-action: pan-y;
      transition: opacity 700ms ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .echo-reel.is-gl .echo-canvas { opacity: 1; }
    .echo-reel.is-dragging .echo-canvas { cursor: grabbing; }

    .echo-list {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 max(20px, calc(50vw - 496px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .echo-list::-webkit-scrollbar { display: none; }

    .echo-card {
      position: relative;
      flex: none;
      height: 86%;
      margin: 0;
      scroll-snap-align: center;
    }

    .echo-card img {
      display: block;
      width: auto;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 5px;
    }

    .echo-card .social-badge { top: 6px; left: 6px; font-size: 9px; padding: 4px 8px; }

    /* WebGL 接管后，DOM 列表只留给读屏与搜索引擎 */
    .echo-reel.is-gl .echo-list {
      inset: auto;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .echo-reel { height: clamp(120px, 34vw, 170px); }
      .echo-canvas {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
    }
  </style>

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();

  <script type="module">
    import * as THREE from "../assets/vendor/three.module.min.js";

    (function () {
      var reel = document.querySelector(".echo-reel");
      if (!reel) return;
      var canvas = reel.querySelector(".echo-canvas");
      var list = reel.querySelector(".echo-list");
      var figures = Array.prototype.slice.call(reel.querySelectorAll(".echo-card"));
      if (!canvas || !figures.length) return;

      var started = false;
      function start() {
        if (started) return;
        started = true;
        try {
          init();
        } catch (error) {
          if (window.console) console.warn("echo reel fallback:", error && error.message);
          reel.classList.remove("is-gl");
        }
      }

      if (document.readyState === "complete") start();
      else window.addEventListener("load", start, { once: true });
      window.setTimeout(start, 1800);

      function init() {
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        var scene = new THREE.Scene();
        var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);

        /* 横向压缩曲线：屏幕 x = X · sin(s / A) / sin(T)。
           中心斜率为 1（原比例最宽），越往两侧卡片越窄、越暗，形成通栏的“宽—窄”节奏。 */
        var T = 1.32;
        var GAP_RATIO = 0.05;

        var vertex = [
          "uniform float uCenter;",
          "uniform vec2 uSize;",
          "uniform float uA;",
          "uniform float uX;",
          "uniform float uT;",
          "varying vec2 vUv;",
          "varying float vShade;",
          "void main() {",
          "  vUv = uv;",
          "  float s = uCenter + position.x * uSize.x;",
          "  float theta = clamp(s / uA, -1.5707, 1.5707);",
          "  float x = uX * sin(theta) / sin(uT);",
          "  float edge = (1.0 - cos(theta)) / (1.0 - cos(uT));",
          "  float y = position.y * uSize.y * (1.0 - 0.16 * clamp(edge, 0.0, 1.0));",
          "  vShade = clamp(edge, 0.0, 1.0);",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(x, y, 0.0, 1.0);",
          "}"
        ].join("\n");

        var fragment = [
          "uniform sampler2D uMap;",
          "uniform vec2 uSize;",
          "uniform float uRadius;",
          "varying vec2 vUv;",
          "varying float vShade;",
          "float sdRound(vec2 p, vec2 b, float r) {",
          "  vec2 q = abs(p) - b + r;",
          "  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;",
          "}",
          "void main() {",
          "  vec2 p = (vUv - 0.5) * uSize;",
          "  float d = sdRound(p, uSize * 0.5, uRadius);",
          "  float aa = fwidth(d) * 1.2;",
          "  float mask = 1.0 - smoothstep(-aa, aa, d);",
          "  if (mask < 0.004) discard;",
          "  vec3 color = texture2D(uMap, vUv).rgb;",
          "  float rim = 1.0 - smoothstep(0.0, 1.6, -d);",
          "  color = mix(color, vec3(1.0), rim * 0.14);",
          "  color *= 1.0 - 0.55 * vShade * vShade;",
          "  gl_FragColor = vec4(color, mask);",
          "}"
        ].join("\n");

        var blank = new THREE.DataTexture(new Uint8Array([22, 21, 26, 255]), 1, 1);
        blank.needsUpdate = true;
        var geometry = new THREE.PlaneGeometry(1, 1, 40, 1);

        var sources = figures.map(function (figure) {
          var img = figure.querySelector("img");
          var ratio = Number(img.getAttribute("width")) / Number(img.getAttribute("height")) || 0.75;
          return {
            figure: figure,
            img: img,
            aspect: Math.min(1.7, Math.max(0.7, ratio)),
            image: null,
            texture: blank,
            meshes: []
          };
        });

        /* 两份副本首尾相接，接缝始终落在可视范围之外 */
        var items = [];
        for (var copy = 0; copy < 2; copy++) {
          sources.forEach(function (source, index) {
            var material = new THREE.ShaderMaterial({
              uniforms: {
                uMap: { value: blank },
                uCenter: { value: 0 },
                uSize: { value: new THREE.Vector2(1, 1) },
                uA: { value: 1 },
                uX: { value: 1 },
                uT: { value: T },
                uRadius: { value: 5 }
              },
              vertexShader: vertex,
              fragmentShader: fragment,
              transparent: true,
              depthTest: false,
              depthWrite: false,
              extensions: { derivatives: true }
            });
            var mesh = new THREE.Mesh(geometry, material);
            mesh.frustumCulled = false;
            scene.add(mesh);
            source.meshes.push(mesh);
            items.push({ source: source, index: index, mesh: mesh, width: 0, start: 0 });
          });
        }

        var cardH = 100;
        var gap = 6;
        var total = 1;
        var halfW = 1;
        var A = 1;

        function measure() {
          var arc = 0;
          items.forEach(function (item) {
            item.width = cardH * item.source.aspect;
            item.start = arc;
            arc += item.width + gap;
          });
          total = arc;
        }

        function badgeText(source) {
          var badge = source.figure.querySelector(".social-badge");
          return badge ? badge.textContent.trim() : "";
        }

        function drawTexture(source) {
          if (!source.image) return;
          var th = 360;
          var tw = Math.round(th * source.aspect);
          var surface = document.createElement("canvas");
          surface.width = tw;
          surface.height = th;
          var g = surface.getContext("2d");
          g.fillStyle = "#16151a";
          g.fillRect(0, 0, tw, th);
          var iw = source.image.naturalWidth;
          var ih = source.image.naturalHeight;
          var sx = 0;
          var sy = 0;
          var sw = iw;
          var sh = ih;
          if (iw / ih > source.aspect) {
            sw = ih * source.aspect;
            sx = (iw - sw) / 2;
          } else {
            sh = iw / source.aspect;
          }
          g.drawImage(source.image, sx, sy, sw, sh, 0, 0, tw, th);

          var label = badgeText(source);
          if (label) {
            var size = 17;
            var family = "px 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif";
            var padX = 11;
            g.font = "600 " + size + family;
            while (size > 10 && g.measureText(label).width + padX * 2 > tw - 20) {
              size -= 1;
              g.font = "600 " + size + family;
            }
            var boxH = size + 12;
            var boxW = Math.min(tw - 20, g.measureText(label).width + padX * 2);
            var x = 10;
            var y = 10;
            var r = boxH / 2;
            g.beginPath();
            g.moveTo(x + r, y);
            g.arcTo(x + boxW, y, x + boxW, y + boxH, r);
            g.arcTo(x + boxW, y + boxH, x, y + boxH, r);
            g.arcTo(x, y + boxH, x, y, r);
            g.arcTo(x, y, x + boxW, y, r);
            g.closePath();
            g.fillStyle = "rgba(10, 9, 12, 0.78)";
            g.fill();
            g.lineWidth = 1;
            g.strokeStyle = "rgba(255, 255, 255, 0.24)";
            g.stroke();
            g.fillStyle = "#ffffff";
            g.textBaseline = "middle";
            g.fillText(label, x + padX, y + boxH / 2 + 1, boxW - padX * 2);
          }

          var texture = new THREE.CanvasTexture(surface);
          texture.minFilter = THREE.LinearMipmapLinearFilter;
          texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
          if (source.texture && source.texture !== blank) source.texture.dispose();
          source.texture = texture;
          source.meshes.forEach(function (mesh) { mesh.material.uniforms.uMap.value = texture; });
          /* 贴图到位立即补画，不依赖动画循环（离屏、后台标签页时同样生效） */
          if (ready) { layout(); renderer.render(scene, camera); }
          dirty = true;
        }

        sources.forEach(function (source) {
          var image = new Image();
          image.decoding = "async";
          image.onload = function () {
            source.image = image;
            drawTexture(source);
          };
          image.src = source.img.currentSrc || source.img.src;
        });

        if (list && "MutationObserver" in window) {
          var relabelTimer = 0;
          new MutationObserver(function () {
            window.clearTimeout(relabelTimer);
            relabelTimer = window.setTimeout(function () { sources.forEach(drawTexture); }, 60);
          }).observe(list, { subtree: true, childList: true, characterData: true });
        }

        var dirty = true;
        var ready = false;
        var offset = 0;
        var target = 0;

        function resize() {
          var w = reel.clientWidth;
          var h = reel.clientHeight;
          if (!w || !h) return;
          var center = items.length ? (offset - items[0].start) / (total || 1) : 0;
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setSize(w, h, false);
          camera.left = -w / 2;
          camera.right = w / 2;
          camera.top = h / 2;
          camera.bottom = -h / 2;
          camera.updateProjectionMatrix();
          cardH = Math.round(h * 0.86);
          gap = Math.max(4, Math.round(cardH * GAP_RATIO));
          halfW = w / 2;
          A = halfW / Math.sin(T);          /* 中心斜率 = 1，中卡保持原比例 */
          measure();
          offset = target = center * total + items[0].start;
          /* setSize 会清空画布：立即补画一帧，避免离屏时尺寸变化留下空白 */
          if (ready) { layout(); renderer.render(scene, camera); }
          dirty = true;
        }

        function wrap(value) {
          return ((value % total) + total * 1.5) % total - total / 2;
        }

        function centerOf(item) {
          return item.start + item.width / 2;
        }

        function nearest(value) {
          var best = items[0];
          var bestDistance = Infinity;
          items.forEach(function (item) {
            var distance = Math.abs(wrap(centerOf(item) - value));
            if (distance < bestDistance) { bestDistance = distance; best = item; }
          });
          return best;
        }

        function snapTo(item) {
          target = offset + wrap(centerOf(item) - offset);
          lastInteract = performance.now();
        }

        function layout() {
          var limit = A * 1.5707 + cardH * 1.8;
          items.forEach(function (item) {
            var c = wrap(centerOf(item) - offset);
            var u = item.mesh.material.uniforms;
            u.uCenter.value = c;
            u.uSize.value.set(item.width, cardH);
            u.uA.value = A;
            u.uX.value = halfW;
            u.uRadius.value = Math.max(3, cardH * 0.025);
            item.mesh.visible = Math.abs(c) < limit;
          });
        }

        /* 屏幕坐标反解回弧长，用于点击定位 */
        function pickAt(clientX) {
          var rect = canvas.getBoundingClientRect();
          var x = clientX - rect.left - rect.width / 2;
          var k = Math.max(-1, Math.min(1, x * Math.sin(T) / halfW));
          var s = Math.asin(k) * A;
          var hit = null;
          items.forEach(function (item) {
            var c = wrap(centerOf(item) - offset);
            if (Math.abs(s - c) <= item.width / 2) hit = item;
          });
          return hit;
        }

        var dragging = false;
        var pointerId = null;
        var startX = 0;
        var startOffset = 0;
        var moved = 0;
        var lastX = 0;
        var lastT = 0;
        var velocity = 0;
        var lastInteract = -1e9;
        var wheelTimer = 0;
        var onScreen = true;

        canvas.addEventListener("pointerdown", function (event) {
          if (event.button > 0) return;
          dragging = true;
          pointerId = event.pointerId;
          startX = lastX = event.clientX;
          startOffset = target = offset;
          lastT = performance.now();
          moved = 0;
          velocity = 0;
          reel.classList.add("is-dragging");
          try { canvas.setPointerCapture(event.pointerId); } catch (error) {}
        });

        canvas.addEventListener("pointermove", function (event) {
          if (!dragging) return;
          var dx = event.clientX - startX;
          moved = Math.max(moved, Math.abs(dx));
          offset = target = startOffset - dx;
          var now = performance.now();
          velocity = (event.clientX - lastX) / Math.max(8, now - lastT);
          lastX = event.clientX;
          lastT = now;
          dirty = true;
        });

        function release(event) {
          if (!dragging) return;
          dragging = false;
          reel.classList.remove("is-dragging");
          if (pointerId !== null) {
            try { canvas.releasePointerCapture(pointerId); } catch (error) {}
            pointerId = null;
          }
          if (moved < 6 && event && event.type === "pointerup") {
            var hit = pickAt(event.clientX);
            if (hit) { snapTo(hit); return; }
          }
          snapTo(nearest(offset - velocity * 240));
        }

        canvas.addEventListener("pointerup", release);
        canvas.addEventListener("pointercancel", release);

        canvas.addEventListener("wheel", function (event) {
          if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
          event.preventDefault();
          target += event.deltaX;
          lastInteract = performance.now();
          window.clearTimeout(wheelTimer);
          wheelTimer = window.setTimeout(function () { snapTo(nearest(target)); }, 160);
        }, { passive: false });

        reel.addEventListener("keydown", function (event) {
          var current = nearest(target);
          var index = items.indexOf(current);
          if (event.key === "ArrowLeft") { event.preventDefault(); snapTo(items[(index - 1 + items.length) % items.length]); }
          else if (event.key === "ArrowRight") { event.preventDefault(); snapTo(items[(index + 1) % items.length]); }
        });

        if ("IntersectionObserver" in window) {
          new IntersectionObserver(function (entries) {
            onScreen = entries.some(function (entry) { return entry.isIntersecting; });
          }, { threshold: 0 }).observe(reel);
        }

        if ("ResizeObserver" in window) new ResizeObserver(resize).observe(reel);
        else window.addEventListener("resize", resize);

        var last = 0;
        function frame(now) {
          window.requestAnimationFrame(frame);
          if (!onScreen || document.hidden) { last = 0; return; }
          var dt = last ? Math.min(48, now - last) : 16;
          last = now;
          if (!dragging && !reduced && now - lastInteract > 2600) target += dt * 0.028;
          if (!dragging) {
            var delta = target - offset;
            if (Math.abs(delta) > 0.05) {
              offset += reduced ? delta : delta * Math.min(1, dt * 0.012);
              dirty = true;
            } else if (offset !== target) {
              offset = target;
              dirty = true;
            }
          }
          if (!dirty) return;
          dirty = false;
          layout();
          renderer.render(scene, camera);
        }

        resize();
        offset = target = centerOf(items[0]);
        layout();
        renderer.render(scene, camera);
        ready = true;
        reel.classList.add("is-gl");
        window.requestAnimationFrame(frame);
      }
    })();
  </script>
  <script>
    (function () {
      var gallery = document.querySelector(".more-gallery");
      if (!gallery) return;
      var items = Array.prototype.slice.call(gallery.querySelectorAll(".more-item"));
      var RATIO = 16 / 9;
      var active = null;

      function gapSize() {
        var cs = getComputedStyle(gallery);
        return parseFloat(cs.columnGap || cs.gap) || 0;
      }

      function growFor(item) {
        var n = items.length;
        var gap = gapSize();
        var inner = gallery.clientWidth - gap * (n - 1);
        var target = gallery.clientHeight * RATIO;
        if (inner <= 0 || target <= 0) return 1;
        var rest = inner - target;
        if (rest <= 0) return 1;
        return Math.max(0.4, (target * (n - 1)) / rest);
      }

      function clear() {
        active = null;
        items.forEach(function (item) {
          item.classList.remove("is-active");
        });
      }

      function activate(item) {
        active = item;
        gallery.style.setProperty("--more-grow", growFor(item).toFixed(3));
        items.forEach(function (other) {
          other.classList.toggle("is-active", other === item);
        });
      }

      items.forEach(function (item) {
        item.addEventListener("mouseenter", function () { activate(item); });
        item.addEventListener("focus", function () { activate(item); });
        item.addEventListener("click", function (event) {
          if (!item.classList.contains("is-active")) {
            event.preventDefault();
            activate(item);
          }
        });
      });

      gallery.addEventListener("mouseleave", function () {
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) clear();
      });

      window.addEventListener("resize", function () {
        if (active) activate(active);
      });
    })();
  </script>

  <script>
    // 案例之间左右切换（按首页作品顺序，只保留已有子页面的项）
    (function () {
      var order = [
        { id: "campaign", label: { zh: "宣发设计", en: "Campaign Design" } },
        { id: "large-screen", label: { zh: "大屏视觉", en: "Large-Screen Visuals" } }
      ];
      var here = "campaign";
      var index = order.findIndex(function (item) { return item.id === here; });
      if (index < 0) return;

      var prev = order[index - 1] || null;
      var next = order[index + 1] || null;
      if (!prev && !next) return;

      var zh = (document.documentElement.lang || "zh").toLowerCase().indexOf("en") !== 0;
      function label(item) { return item ? item.label[zh ? "zh" : "en"] : ""; }
      function href(item) { return item.id + ".html"; }

      var hint = document.createElement("div");
      hint.className = "switcher-hint";
      hint.setAttribute("role", "status");
      var parts = [];
      if (prev) parts.push('<a href="' + href(prev) + '">← ' + label(prev) + "</a>");
      parts.push('<span class="switcher-tip">' + (zh ? "左右滑动切换案例" : "Swipe to switch case") + "</span>");
      if (next) parts.push('<a href="' + href(next) + '">' + label(next) + " →</a>");
      hint.innerHTML = parts.join('<span class="switcher-sep">·</span>');
      document.body.appendChild(hint);

      var hideTimer = 0;
      function reveal(ms) {
        hint.classList.add("is-visible");
        window.clearTimeout(hideTimer);
        hideTimer = window.setTimeout(function () {
          hint.classList.remove("is-visible");
        }, ms || 2600);
      }

      var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      if (canHover) {
        document.addEventListener("mousemove", function () { reveal(); }, { passive: true });
      } else {
        window.setTimeout(function () { reveal(4200); }, 1200);
      }

      hint.addEventListener("mouseenter", function () {
        window.clearTimeout(hideTimer);
        hint.classList.add("is-visible");
      });
      hint.addEventListener("mouseleave", function () { reveal(1200); });

      function go(item) {
        if (!item) return;
        window.location.href = href(item);
      }

      // 移动端滑动
      var startX = 0;
      var startY = 0;
      var tracking = false;
      var ignored = ".echo-reel, .echo-list, .case-hero-media, .more-gallery, input, textarea, select";

      document.addEventListener("touchstart", function (event) {
        if (event.touches.length !== 1) { tracking = false; return; }
        var target = event.target;
        if (target && target.closest && target.closest(ignored)) { tracking = false; return; }
        tracking = true;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }, { passive: true });

      document.addEventListener("touchend", function (event) {
        if (!tracking) return;
        tracking = false;
        var touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return;
        var dx = touch.clientX - startX;
        var dy = touch.clientY - startY;
        if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
        if (dx < 0) { go(next); } else { go(prev); }
      }, { passive: true });

      // 桌面：方向键 + 拖动
      document.addEventListener("keydown", function (event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var tag = (event.target && event.target.tagName) || "";
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        if (event.key === "ArrowRight") { go(next); }
        else if (event.key === "ArrowLeft") { go(prev); }
      });

      var dragStart = null;
      document.addEventListener("mousedown", function (event) {
        if (!canHover) return;
        var target = event.target;
        if (target && target.closest && target.closest(ignored)) { dragStart = null; return; }
        dragStart = event.clientX;
      });

      document.addEventListener("mouseup", function (event) {
        if (dragStart === null) return;
        var dx = event.clientX - dragStart;
        dragStart = null;
        if (Math.abs(dx) < 140) return;
        if (dx < 0) { go(next); } else { go(prev); }
      });
    })();
  </script>
</body>

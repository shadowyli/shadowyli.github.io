      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();
  </script>
  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", closeDialog);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>
  <script>
    (function () {
      var stage = document.querySelector(".social-float");
      if (!stage) return;
      var track = stage.querySelector(".social-track");
      var baseSet = stage.querySelector(".social-set");
      if (track && baseSet && !track.querySelector(".social-set--clone")) {
        var clone = baseSet.cloneNode(true);
        clone.classList.add("social-set--clone");
        clone.setAttribute("aria-hidden", "true");
        Array.prototype.forEach.call(clone.querySelectorAll("img"), function (image) {
          image.alt = "";
        });
        track.appendChild(clone);
      }
      var slots = Array.prototype.slice.call(stage.querySelectorAll(".social-slot"));
      var depths = slots.map(function (slot) {
        return parseFloat(getComputedStyle(slot).getPropertyValue("--depth")) || 0.6;
      });
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var pointerX = 0;
      var pointerY = 0;
      var ticking = false;

      function render() {
        ticking = false;
        var rect = stage.getBoundingClientRect();
        var viewport = window.innerHeight || 1;
        var center = rect.top + rect.height / 2 - viewport / 2;
        slots.forEach(function (slot, index) {
          var depth = depths[index];
          slot.style.setProperty("--sy", (-center * depth * 0.2).toFixed(1) + "px");
          slot.style.setProperty("--mx", (pointerX * depth * 34).toFixed(1) + "px");
          slot.style.setProperty("--my", (pointerY * depth * 34).toFixed(1) + "px");
        });
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      if (reduce) return;

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      stage.addEventListener("pointermove", function (event) {
        var rect = stage.getBoundingClientRect();
        pointerX = (event.clientX - rect.left) / rect.width - 0.5;
        pointerY = (event.clientY - rect.top) / rect.height - 0.5;
        request();
      });
      stage.addEventListener("pointerleave", function () {
        pointerX = 0;
        pointerY = 0;
        request();
      });
      render();
    })();
  </script>
  <script type="module">
    import createGlobe from "../assets/vendor/cobe.esm.js";

    (function () {
      var canvas = document.querySelector(".globe-canvas");
      if (!canvas) return;

      var MARKERS = [
        { location: [31.2304, 121.4737], size: 0.09 },
        { location: [39.9042, 116.4074], size: 0.07 },
        { location: [22.3193, 114.1694], size: 0.06 },
        { location: [35.6762, 139.6503], size: 0.05 },
        { location: [1.3521, 103.8198], size: 0.06 },
        { location: [13.7563, 100.5018], size: 0.05 },
        { location: [14.5995, 120.9842], size: 0.05 },
        { location: [-6.2088, 106.8456], size: 0.06 },
        { location: [25.2048, 55.2708], size: 0.05 },
        { location: [51.5072, -0.1276], size: 0.05 },
        { location: [40.7128, -74.006], size: 0.06 },
        { location: [34.0522, -118.2437], size: 0.05 },
        { location: [-23.5505, -46.6333], size: 0.06 },
        { location: [-33.8688, 151.2093], size: 0.05 }
      ];

      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var phi = 2.2;
      var dragging = false;
      var lastX = 0;
      var visible = true;
      var size = 0;
      var globe = null;
      var rebuildTimer = 0;

      function build() {
        var next = Math.round(canvas.offsetWidth);
        if (!next) return;
        size = next;
        if (globe) { globe.destroy(); globe = null; }
        globe = createGlobe(canvas, {
          devicePixelRatio: dpr,
          width: size * dpr,
          height: size * dpr,
          phi: phi,
          theta: 0.26,
          dark: 1,
          diffuse: 1.15,
          mapSamples: 18000,
          mapBrightness: 7,
          baseColor: [0.11, 0.105, 0.125],
          markerColor: [1, 0.208, 0.365],
          glowColor: [0.17, 0.16, 0.19],
          markers: MARKERS,
          onRender: function (state) {
            state.phi = phi;
            state.width = size * dpr;
            state.height = size * dpr;
            if (!dragging && !reduced && visible) phi += 0.0028;
          }
        });
        canvas.classList.add("is-ready");
      }

      function scheduleRebuild() {
        window.clearTimeout(rebuildTimer);
        rebuildTimer = window.setTimeout(build, 150);
      }

      try {
        build();
      } catch (error) {
        canvas.classList.remove("is-ready");
        return;
      }

      canvas.addEventListener("pointerdown", function (event) {
        dragging = true;
        lastX = event.clientX;
        canvas.classList.add("is-dragging");
        if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", function (event) {
        if (!dragging) return;
        phi += (event.clientX - lastX) / 220;
        lastX = event.clientX;
      });

      function endDrag(event) {
        if (!dragging) return;
        dragging = false;
        canvas.classList.remove("is-dragging");
        if (canvas.releasePointerCapture && event.pointerId !== undefined) {
          canvas.releasePointerCapture(event.pointerId);
        }
      }

      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("pointerleave", endDrag);

      if ("ResizeObserver" in window) {
        new ResizeObserver(scheduleRebuild).observe(canvas);
      } else {
        window.addEventListener("resize", scheduleRebuild);
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          visible = entries.some(function (entry) { return entry.isIntersecting; });
        }, { threshold: 0 }).observe(canvas);
      }
    })();
  </script>

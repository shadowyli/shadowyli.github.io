  <style>
    .case-body .case-pair + .case-frame {
      margin-top: 6px;
    }

    /* 排版规则：① 同一游戏相邻 ② 竖版 2–3 张一行、禁止竖版独占整行 ③ 竖版凑不齐行时与横版并排 ④ 横版主要单独一行、次要两张一行 ⑤ 4 张以上竖版并成一条系列条 ⑥ 尽量避免同样张数的行相邻 */
    .case-gallery { display: block; }

    .case-row { margin: 0; }

    .case-row + .case-row { margin-top: 6px; }

    .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame + .case-frame { margin-top: 0; }

    /* 竖版行：至少 2 张、按张数等分铺满，禁止竖版单张独占一行 */
    .case-row[data-layout="portrait"] {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 6px;
    }

    /* 系列条：4 张以上竖版并成一条，避免同样张数的行紧挨着出现 */
    .case-row[data-layout="strip"] {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    /* 横版 + 竖版并排：横版保形（3:1 分栏，裁切仅 ~5%），竖版因此不独占一行 */
    .case-row[data-layout="duo"] {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 6px;
    }

    .case-row[data-layout="duo"] > .case-frame { min-height: 0; }

    .case-row[data-layout="duo"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .case-row[data-layout="secondary"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .social-badge--long {
      white-space: nowrap;
      font-size: 10px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 clamp(20px, 2.6vw, 32px);
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 720px) {
      /* 手机端竖版行等分，不留通栏的单张 */
      .case-row[data-layout="portrait"] { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
      /* 横版 + 竖版改为上下排列，避免竖版被压到无法辨认 */
      .case-row[data-layout="strip"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .case-row[data-layout="duo"] { grid-template-columns: 1fr; }
      .case-row[data-layout="duo"] .case-frame--image img { height: auto; object-fit: contain; }
    }

    /* 序言：一句主张 + 署名，不做语录卡 */
    .case-body .voice {
      position: relative;
      display: block;
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: clamp(14px, 1.6vw, 20px) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    }

    .voice-body {
      position: relative;
      z-index: 1;
      padding: 0;
    }

    .case-body .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: none;
      margin: 0 0 clamp(10px, 1.2vw, 14px);
      padding: 3px 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .voice-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .case-body .voice-lead {
      width: 100%;
      max-width: 40em;
      margin: 0 0 clamp(12px, 1.4vw, 18px);
      color: var(--text);
      font-size: clamp(16px, 1.4vw, 21px);
      font-weight: 300;
      line-height: 1.65;
      letter-spacing: 0;
      text-wrap: pretty;
    }

    .voice-author {
      display: flex;
      align-items: flex-start;
      gap: clamp(12px, 1.5vw, 16px);
    }

    .voice-rule {
      display: block;
      flex: none;
      width: 22px;
      height: 1px;
      margin: 8px 0 0;
      background: var(--text);
    }

    .case-body .voice-name {
      margin: 0;
      max-width: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    .case-body .voice-role {
      margin: 2px 0 0;
      max-width: none;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .case-body .voice { padding: 16px 0; }
    }

    .case-body .globe-close {
      margin-top: clamp(52px, 7vw, 96px);
    }

    .orbit-stage {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      aspect-ratio: 1;
      perspective: 1500px;
      perspective-origin: 50% 50%;
    }

    .orbit-stage .globe-canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      display: block;
      width: 72%;
      height: 72%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 900ms ease;
    }

    .orbit-stage .globe-canvas.is-ready { opacity: 1; }

    .orbit-sphere {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: orbit-spin 110s linear infinite;
    }

    .orbit-slot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transform: rotateY(var(--lon)) rotateX(var(--lat)) translateZ(var(--r, 273px));
    }

    .orbit-card {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: var(--w, 120px);
      transform: translate(-50%, -50%);
      background: var(--surface);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .orbit-card img {
      display: block;
      width: 100%;
      height: auto;
      transform: rotate(var(--tilt, 0deg));
    }

    @keyframes orbit-spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit-sphere { animation: none; }
    }

    @media (max-width: 720px) {
      .orbit-stage {
        width: 100%;
        aspect-ratio: auto;
        perspective: none;
      }

      .orbit-stage .globe-canvas {
        position: relative;
        left: auto;
        top: auto;
        width: min(100%, 300px);
        height: auto;
        aspect-ratio: 1;
        margin: 0 auto;
        transform: none;
      }

      .orbit-sphere {
        position: relative;
        inset: auto;
        display: flex;
        gap: 8px;
        margin-top: 18px;
        padding: 4px 4px 10px;
        overflow-x: auto;
        animation: none;
        transform: none;
        scrollbar-width: none;
      }

      .orbit-sphere::-webkit-scrollbar { display: none; }

      .orbit-slot {
        position: relative;
        left: auto;
        top: auto;
        width: auto;
        height: auto;
        flex: 0 0 auto;
        transform: none;
      }

      .orbit-card {
        position: relative;
        width: 128px;
        transform: none;
      }

      .orbit-card .social-badge { display: none; }
    }
  </style>

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", closeDialog);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>
  <script type="module">
    import createGlobe from "../assets/vendor/cobe.esm.js";

    (function () {
      var canvas = document.querySelector(".globe-canvas");
      if (!canvas) return;

      var MARKERS = [
        { location: [31.2304, 121.4737], size: 0.055 },
        { location: [39.9042, 116.4074], size: 0.055 },
        { location: [22.3193, 114.1694], size: 0.055 },
        { location: [35.6762, 139.6503], size: 0.055 },
        { location: [1.3521, 103.8198], size: 0.055 },
        { location: [13.7563, 100.5018], size: 0.055 },
        { location: [14.5995, 120.9842], size: 0.055 },
        { location: [-6.2088, 106.8456], size: 0.055 },
        { location: [25.2048, 55.2708], size: 0.055 },
        { location: [51.5072, -0.1276], size: 0.055 },
        { location: [40.7128, -74.006], size: 0.055 },
        { location: [34.0522, -118.2437], size: 0.055 },
        { location: [-23.5505, -46.6333], size: 0.055 },
        { location: [-33.8688, 151.2093], size: 0.055 }
      ];

      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var phi = 2.2;
      var dragging = false;
      var lastX = 0;
      var visible = true;
      var size = 0;
      var globe = null;
      var rebuildTimer = 0;

      function build() {
        var next = Math.round(canvas.offsetWidth);
        if (!next) return;
        size = next;
        if (globe) { globe.destroy(); globe = null; }
        globe = createGlobe(canvas, {
          devicePixelRatio: dpr,
          width: size * dpr,
          height: size * dpr,
          phi: phi,
          theta: 0.26,
          dark: 1,
          diffuse: 1.15,
          mapSamples: 18000,
          mapBrightness: 7,
          baseColor: [0.11, 0.105, 0.125],
          markerColor: [1, 0.863, 0.098],
          glowColor: [0.17, 0.16, 0.19],
          markers: MARKERS,
          onRender: function (state) {
            state.phi = phi;
            state.width = size * dpr;
            state.height = size * dpr;
            if (!dragging && !reduced && visible) phi += 0.0028;
          }
        });
        canvas.classList.add("is-ready");
      }

      function scheduleRebuild() {
        window.clearTimeout(rebuildTimer);
        rebuildTimer = window.setTimeout(build, 150);
      }

      try {
        build();
      } catch (error) {
        canvas.classList.remove("is-ready");
        return;
      }

      if ("ResizeObserver" in window) {
        new ResizeObserver(scheduleRebuild).observe(canvas);
      } else {
        window.addEventListener("resize", scheduleRebuild);
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          visible = entries.some(function (entry) { return entry.isIntersecting; });
        }, { threshold: 0 }).observe(canvas);
      }
    })();
  </script>

  <style>
    .case-body .case-pair + .case-frame {
      margin-top: 6px;
    }

    /* 排版规则：① 同一游戏相邻 ② 竖版 2–3 张一行、禁止竖版独占整行 ③ 竖版凑不齐行时与横版并排 ④ 横版主要单独一行、次要两张一行 ⑤ 4 张以上竖版并成一条系列条 ⑥ 尽量避免同样张数的行相邻 ⑦ 手机端同样禁止竖版单独一行（横竖并排的行在手机上也保持并排） */
    .case-gallery { display: block; }

    .case-row { margin: 0; align-items: stretch; }

    .case-row > .case-frame { display: flex; align-items: stretch; }

    .case-frame--video { display: block; }

    .case-frame--video .case-frame-video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4608 / 1664;
      object-fit: cover;
      background: #000;
    }

    .case-row[data-layout="secondary"] .case-frame--image img,
    .case-row[data-layout="strip"] .case-frame--image img,
    .case-row[data-layout="portrait"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .case-row + .case-row { margin-top: 6px; }

    .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame { margin: 0; }

    .case-body .case-row > .case-frame + .case-frame { margin-top: 0; }

    /* 竖版行：至少 2 张、按张数等分铺满，禁止竖版单张独占一行 */
    .case-row[data-layout="portrait"] {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 6px;
    }

    /* 系列条：4 张以上竖版并成一条，避免同样张数的行紧挨着出现 */
    .case-row[data-layout="strip"] {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .case-row[data-layout="strip"].strip-six {
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    /* 横版 + 竖版并排：横版保形（3:1 分栏，裁切仅 ~5%），竖版因此不独占一行 */
    .case-row[data-layout="duo"] {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 6px;
    }

    .case-row[data-layout="duo"] > .case-frame { min-height: 0; }

    .case-row[data-layout="duo"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 宽幅动画 + 方形主视觉：按两张原图比例分栏，等高且不裁切 */
    .case-row[data-layout="arson-pair"] {
      display: grid;
      grid-template-columns: 2.1622fr 1fr;
      gap: 6px;
      align-items: start;
    }

    .case-row[data-layout="arson-pair"] .case-frame { margin: 0; }

    /* 左侧主图放大，右侧两张上下叠放 */
    .case-row[data-layout="hero-stack"] {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 6px;
      align-items: stretch;
    }

    .case-row[data-layout="hero-stack"] > .case-frame { margin: 0; }

    .case-body .case-row[data-layout="hero-stack"] .case-frame { margin: 0; }

    .case-row[data-layout="hero-stack"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .case-stack {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      min-height: 0;
    }

    .case-stack > .case-frame { margin: 0; min-height: 0; }

    @media (max-width: 720px) {
      .case-row[data-layout="arson-pair"] { grid-template-columns: 1fr; }
    }

    .case-row[data-layout="secondary"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    /* 城市官宣 + 主视觉：双栏填满行高，避免亚像素缝 */
    .eggy-city-pair .case-frame--image img {
      height: 100%;
      object-fit: cover;
    }

    /* 竖版海报：2 张一行起排，可扩展到 3 / 4 张（6 张仅用于次次要系列） */
    .case-row[data-layout="portrait-2"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .case-row[data-layout="portrait-2"] img {
      width: 100%;
      height: auto;
    }

    .case-row[data-layout="portrait-3"] {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .case-row[data-layout="portrait-3"] img {
      width: 100%;
      height: auto;
    }

    .case-row[data-layout="portrait-4"] {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .case-row[data-layout="portrait-4"] img {
      width: 100%;
      height: auto;
    }

    @media (max-width: 720px) {
      .case-row[data-layout="portrait-4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* 动画静帧垫底：播放结束后回到静图，而不是视频首帧 */
    .case-media-slot {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }

    .case-media-slot > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .case-media-slot > video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }

    .case-media-slot.is-playing > video { opacity: 1; }

    /* 手机端一键播放：有可见视频时才浮出，避免整页常驻遮挡回声区 */
    @media (max-width: 720px) {
      .case-page .mobile-play { display: none; }
      .case-page .mobile-play.is-visible { display: inline-flex; }
    }

    /* 活动横幅：由外层 banner-grid 统一三列，手机单列保证文案可读 */
    .case-row[data-layout="banners"] {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .banner-grid .case-row[data-layout="banners"] { display: contents; }

    /* banner-grid 后紧跟的普通行补回 6px 间距（跨容器时 + 选择器失效） */
    .case-gallery .banner-grid + .case-row { margin-top: 6px; }

    @media (max-width: 720px) {
      .banner-grid { grid-template-columns: 1fr; }
    }

    .case-row[data-layout="banners"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .social-badge--long {
      white-space: normal;
      font-size: 12.5px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 6px;
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @media (max-width: 720px) {
      /* 手机端竖版行等分，不留通栏的单张 */
      .case-row[data-layout="portrait"] { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
      /* 系列条：手机端保持三列并排，让系列作为一组被看完 */
      .case-row[data-layout="strip"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .case-row[data-layout="banners"] { grid-template-columns: 1fr; }
    }

    /* 署名模块：参考 FlowX 案例页 */
    .case-credits {
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: 0 0 clamp(14px, 1.6vw, 20px);
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
      list-style: none;
    }

    .case-credits li {
      color: var(--text-muted);
      font-family: var(--font-cjk);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    @media (max-width: 560px) {
      .case-credits li { font-size: 11px; }
    }

    /* 底部收口：分割线与回声区之间的留白压到最小可用值 */
    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    .case-body .case-related-divider { margin: 32px 0 22px; }

    .case-body .globe-close {
      margin-top: clamp(14px, 1.8vw, 22px);
    }

    /* 回声：通栏 WebGL 展示带，中间最宽、两侧渐窄，左右边缘渐隐到底色 */
    .echo-reel {
      position: relative;
      width: 100vw;
      height: clamp(190px, 19vw, 280px);
      margin: 0 0 0 calc(50% - 50vw);
      outline: none;
    }

    .echo-reel:focus-visible .echo-canvas {
      outline: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
      outline-offset: -4px;
    }

    .echo-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: grab;
      touch-action: pan-y;
      transition: opacity 700ms ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .echo-reel.is-gl .echo-canvas { opacity: 1; }
    .echo-reel.is-dragging .echo-canvas { cursor: grabbing; }

    .echo-list {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 max(20px, calc(50vw - 496px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .echo-list::-webkit-scrollbar { display: none; }

    .echo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: none;
      height: 97%;
      margin: 0;
      scroll-snap-align: center;
    }

    .echo-card img {
      display: block;
      width: auto;
      height: calc(100% - 31px);
      max-height: calc(100% - 31px);
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 5px;
    }

    .echo-card .social-badge {
      position: static;
      order: -1;
      align-self: flex-start;
      max-width: 100%;
      margin: 0 0 6px;
      border-color: rgba(255, 255, 255, .48);
      background: rgba(8, 7, 10, .94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      padding: 5px 11px;
      white-space: normal;
    }

    /* WebGL 接管后，DOM 列表只留给读屏与搜索引擎 */
    .echo-reel.is-gl .echo-list {
      inset: auto;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .echo-reel { height: clamp(180px, 52vw, 240px); }
      .echo-canvas {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
    }

    @media (min-width: 2400px) {
      .echo-card .social-badge { padding: 6px 12px; font-size: 14px; }
    }
  </style>
</head>

      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();
  </script>
  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");
      var lastFocus = null;

      function openDialog() {
        lastFocus = document.activeElement;
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        var returnTo = lastFocus && lastFocus !== document.body ? lastFocus : trigger;
        if (returnTo && typeof returnTo.focus === "function") returnTo.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      /* 仅点击遮罩关闭，避免长按二维码保存时误触关闭 */
      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) closeDialog();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>

  <script>
    (function () {
      var videos = Array.prototype.slice.call(document.querySelectorAll(".case-frame-video"));
      if (!videos.length) return;

      function play(video) {
        if (!video.paused) return;
        try { video.currentTime = 0; } catch (error) {}
        video.muted = true;
        var promise = video.play();
        if (promise && promise.catch) promise.catch(function () {});
      }

      videos.forEach(function (video) {
        video.addEventListener("click", function () { play(video); });
        video.addEventListener("playing", function () {
          var slot = video.closest(".case-media-slot");
          if (slot) slot.classList.add("is-playing");
        });
        video.addEventListener("ended", function () {
          try { video.currentTime = 0; } catch (error) {}
          var slot = video.closest(".case-media-slot");
          if (slot) slot.classList.remove("is-playing");
        });
      });

      if (!("IntersectionObserver" in window)) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var video = entry.target.querySelector("video");
          if (!video) return;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
            if (entry.target.dataset.played !== "1") {
              entry.target.dataset.played = "1";
              play(video);
            }
          } else if (!entry.isIntersecting) {
            delete entry.target.dataset.played;
            if (!video.paused) video.pause();
            entry.target.classList.remove("is-playing");
          }
        });
      }, { threshold: [0, 0.35] });

      videos.forEach(function (video) {
        observer.observe(video.closest("figure") || video);
      });

      var playButton = document.querySelector(".mobile-play");
      if (playButton && window.matchMedia("(max-width: 720px)").matches) {
        var visibleVideos = [];
        function syncPlayButton() {
          playButton.classList.toggle("is-visible", visibleVideos.length > 0);
        }
        var buttonObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var index = visibleVideos.indexOf(entry.target);
            if (entry.isIntersecting && entry.intersectionRatio >= 0.25) {
              if (index < 0) visibleVideos.push(entry.target);
            } else if (index > -1) {
              visibleVideos.splice(index, 1);
            }
          });
          syncPlayButton();
        }, { threshold: [0, 0.25] });
        videos.forEach(function (video) {
          buttonObserver.observe(video);
        });
        playButton.addEventListener("click", function () {
          visibleVideos.slice().forEach(function (video) { play(video); });
        });
      }
    })();
  </script>

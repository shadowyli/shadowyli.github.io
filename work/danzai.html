    /* 序言：胶囊 + 署名排成一行（与站内宣发设计案例页保持一致） */
    .case-body .voice {
      position: relative;
      display: block;
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: clamp(14px, 1.6vw, 20px) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    }

    .voice-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(12px, 1.5vw, 20px);
      padding: 0;
      min-height: 26px;
    }

    .case-body .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: none;
      flex: none;
      margin: 0;
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .voice-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .voice-author {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.1vw, 13px);
      min-height: 26px;
    }

    .voice-rule {
      display: block;
      flex: none;
      width: 22px;
      height: 1px;
      margin: 0;
      background: color-mix(in srgb, var(--text) 45%, transparent);
    }

    .case-body .voice-name {
      margin: 0;
      max-width: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .case-body .voice-role {
      margin: 0;
      max-width: none;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.2;
    }

    @media (max-width: 720px) {
      .case-body .voice { padding: 16px 0; }
    }

    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    /* 标题与图之间只留一点呼吸，不沿用区块之间的默认大间距 */
    .case-gallery > h2 { margin-bottom: clamp(16px, 1.6vw, 22px); }

    /* 空白页内容较短：桌面端让页脚始终落在视口底部 */
    @media (min-width: 721px) {
      body.case-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .case-main { flex: 1; }
    }
    /* 视频槽位：默认显示静帧，入场播放时覆盖动画（与梦幻西游案例页一致） */
    .case-gallery .case-media-slot {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }
    .case-gallery .case-media-slot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .case-gallery .case-media-slot video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      background: var(--surface);
      transition: opacity 240ms ease;
    }
    .case-gallery .case-media-slot.is-playing video { opacity: 1; }

    /* 视频 + 静态分镜：左片右板，分镜两行四列 */
    .case-body .case-credit-top {
      margin: 0 0 clamp(18px, 2.4vw, 28px);
      max-width: none;
    }
    .case-video-split {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: clamp(10px, 1.2vw, 16px);
      align-items: center;
    }
    .case-video-split .case-media-slot { margin: 0; }
    .case-board-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-self: center;
    }
    .case-board-label {
      margin: 0;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .case-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 0.6vw, 8px);
    }
    .case-board figure { margin: 0; }
    .case-board img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    @media (max-width: 720px) {
      .case-video-split { grid-template-columns: 1fr; }
    }

    /* 右下角声音开关 */
    .case-media-slot .case-sound {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .36);
      border-radius: 999px;
      background: rgba(8, 7, 10, .78);
      color: #ffffff;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .case-media-slot .case-sound:hover { background: rgba(8, 7, 10, .92); border-color: rgba(255, 255, 255, .62); }
    .case-media-slot .case-sound[aria-pressed="true"] {
      background: rgba(255, 255, 255, .94);
      border-color: transparent;
      color: #08070a;
    }

    /* 回声带上方的分割线 */
    .case-body .case-echo-divider {
      margin: clamp(56px, 7vw, 88px) 0 clamp(18px, 2vw, 26px);
    }

    /* 设计的回声：通栏 WebGL 展示带，中间最宽、两侧渐窄，左右边缘渐隐到底色 */
    .social-badge--long {
      white-space: normal;
      font-size: 12.5px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 6px;
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .echo-reel {
      position: relative;
      width: 100vw;
      height: clamp(190px, 19vw, 280px);
      margin: 0 0 0 calc(50% - 50vw);
      outline: none;
    }

    .echo-reel:focus-visible .echo-canvas {
      outline: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
      outline-offset: -4px;
    }

    .echo-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: grab;
      touch-action: pan-y;
      transition: opacity 700ms ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .echo-reel.is-gl .echo-canvas { opacity: 1; }
    .echo-reel.is-dragging .echo-canvas { cursor: grabbing; }

    .echo-list {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 max(20px, calc(50vw - 496px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .echo-list::-webkit-scrollbar { display: none; }

    .echo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: none;
      height: 97%;
      margin: 0;
      scroll-snap-align: center;
    }

    .echo-card img {
      display: block;
      width: auto;
      height: calc(100% - 31px);
      max-height: calc(100% - 31px);
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 5px;
    }

    .echo-card .social-badge {
      position: static;
      order: -1;
      align-self: flex-start;
      max-width: 100%;
      margin: 0 0 6px;
      border-color: rgba(255, 255, 255, .48);
      background: rgba(8, 7, 10, .94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      padding: 5px 11px;
      white-space: normal;
    }

    /* WebGL 接管后，DOM 列表只留给读屏与搜索引擎 */
    .echo-reel.is-gl .echo-list {
      inset: auto;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .echo-reel { height: clamp(180px, 52vw, 240px); }
      .echo-canvas {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
    }

  </style>

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", closeDialog);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>
  <script>
    (function () {
      var slots = Array.prototype.slice.call(document.querySelectorAll(".case-media-slot[data-video]"));
      if (!slots.length) return;

      function attach(slot) {
        var video = slot.querySelector("video");
        var src = slot.getAttribute("data-video");
        if (!video || !src) return null;
        video.loop = false; // 只播一次：结束后停在末帧，末帧与静图呼应
        if (video.getAttribute("src") !== src) {
          video.setAttribute("src", src);
          try { video.load(); } catch (error) {}
        }
        return video;
      }

      function isSoundOn(slot) {
        var button = slot.querySelector(".case-sound");
        return !!button && button.getAttribute("aria-pressed") === "true";
      }

      function play(slot) {
        var video = attach(slot);
        if (!video) return;
        if (!video.paused && !video.ended) return;
        try { video.currentTime = 0; } catch (error) {}
        video.muted = !isSoundOn(slot);
        var promise = video.play();
        if (promise && promise.catch) promise.catch(function () {});
      }

      function stop(slot) {
        var video = slot.querySelector("video");
        if (video && !video.paused) video.pause();
        slot.classList.remove("is-playing");
      }

      function syncSoundLabel(slot, on) {
        var button = slot.querySelector(".case-sound");
        if (!button) return;
        var language = document.documentElement.lang || "zh-CN";
        var english = language.indexOf("en") === 0;
        var label = on ? (english ? "Mute" : "静音") : (english ? "Sound" : "声音");
        button.textContent = label;
        button.setAttribute("aria-label", on ? (english ? "Mute the video" : "关闭声音") : (english ? "Play with sound" : "打开声音"));
      }

      slots.forEach(function (slot) {
        var video = slot.querySelector("video");
        if (!video) return;

        video.addEventListener("playing", function () {
          slot.classList.add("is-playing");
        });

        video.addEventListener("ended", function () {
          slot.classList.remove("is-playing");
        });

        var sound = slot.querySelector(".case-sound");
        if (sound) {
          sound.addEventListener("click", function (event) {
            event.stopPropagation();
            var target = attach(slot);
            if (!target) return;
            var on = sound.getAttribute("aria-pressed") !== "true";
            sound.setAttribute("aria-pressed", on ? "true" : "false");
            syncSoundLabel(slot, on);
            target.muted = !on;
            if (target.ended || target.paused) {
              try { target.currentTime = 0; } catch (error) {}
              var promise = target.play();
              if (promise && promise.catch) promise.catch(function () {});
            }
          });
        }

        // 点击 = 手动重播（触屏设备没有悬停，也能重看）
        slot.addEventListener("click", function () { play(slot); });
      });

      if (!("IntersectionObserver" in window)) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var slot = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
            if (slot.dataset.played !== "1") {
              slot.dataset.played = "1";
              play(slot);
            }
          } else if (!entry.isIntersecting) {
            delete slot.dataset.played;
            stop(slot);
          }
        });
      }, { threshold: [0, 0.35] });

      slots.forEach(function (slot) { observer.observe(slot); });
    })();
  </script>

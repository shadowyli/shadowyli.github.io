  <style>
    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    /* 关于与画廊之间收紧留白 */
    .case-body .case-intro + .case-gallery { margin-top: clamp(20px, 2.2vw, 28px); }

    /* 关于：与梦手案例统一为小号标签 + 正文排版 */
    .case-body .case-intro h2 {
      margin-bottom: 4px;
      color: #a4a4ad;
      font-size: 9px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.08em;
    }
    .case-body .case-intro p {
      color: #696969;
    }

    @media (max-width: 720px) {
      .case-body .case-intro h2 { font-size: 8px; }
      .case-body .case-intro p {
        margin-bottom: 12px;
        font-size: 9.8px;
        line-height: 1.8;
      }
    }

    /* 去掉模块标题后连成一条画廊：分组之间只留图片同款 6px 缝 */
    .case-body .case-gallery + .case-gallery { margin-top: 6px; }
    /* 站内全局给 #case-gallery-video 留了大间距，这里压平 */
    .case-body #case-gallery-video { margin-top: 6px; }

    .case-row + .case-row { margin-top: 6px; }

    /* VI 手册：一行五张，未定图的位置留空占位 */
    .case-vi-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .case-vi-row--four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 720px) {
      .case-vi-row { gap: 3px; }
    }
    /* 覆盖全局「相邻 frame 上边距」（手机端 site-wide.css 用 !important 压到 4px），
       否则每行第 2 张起会比第 1 张低 4px，行首出现错位 */
    .case-gallery .case-vi-row .case-frame { margin: 0 !important; }

    /* 空白页内容较短：桌面端让页脚始终落在视口底部 */
    @media (min-width: 721px) {
      body.case-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .case-main { flex: 1; }
    }
    /* 视频槽位：默认显示静帧，入场播放时覆盖动画（与梦幻西游案例页一致） */
    .case-gallery .case-media-slot {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }
    .case-gallery .case-media-slot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .case-gallery .case-media-slot video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      background: var(--surface);
      transition: opacity 240ms ease;
    }
    .case-gallery .case-media-slot.is-playing video { opacity: 1; }

    /* 视频 + 静态分镜：左片右板，分镜两行四列 */
    .case-body .case-credit-top {
      margin: 0 0 clamp(18px, 2.4vw, 28px);
      max-width: none;
    }
    .case-video-split {
      display: grid;
      /* 1 : 2 —— 分镜四列两行铺满整列高度时，视频列刚好与分镜板等高 */
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      gap: 6px;
      align-items: stretch;
    }
    .case-video-split .case-media-slot { margin: 0; }
    /* 视频静帧铺满列高，消除分镜板与视频之间的亚像素高度差 */
    .case-video-split .case-media-slot img {
      height: 100%;
      object-fit: cover;
    }
    .case-board-wrap {
      display: flex;
      align-self: stretch;
    }
    /* 两行四列，按原比例完整显示，整体高度与左侧视频齐平 */
    .case-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }
    .case-board figure { margin: 0; }
    .case-board img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border: 0;
      border-radius: 0;
      background: var(--surface);
    }
    /* 手机端拿不到自动播放权限：每块动画单独给一个播放按钮（桌面靠入场自动播放，不显示按钮） */
    .case-gallery .slot-play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 3;
      display: none;
      width: clamp(36px, 34%, 56px);
      aspect-ratio: 1;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(12, 11, 15, 0.62);
      color: #ffffff;
      cursor: pointer;
      transform: none;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 200ms ease;
    }
    .case-gallery .slot-play svg { width: 42%; height: 42%; margin-left: 8%; }
    /* 正在播放时让出画面，播完（回到静图）再浮回来，等于「重播」入口 */
    .case-gallery .case-media-slot.is-playing .slot-play {
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 720px), (hover: none) {
      .case-gallery .slot-play { display: grid; }
    }
    /* KV 两张：桌面端也常驻播放按钮，滚走再回来时不自动播放，靠它重播 */
    .case-gallery .kv-slot .slot-play { display: grid; }
    /* 手机端一键播放：页面上有动画在视野里才浮出，避免常驻遮挡回声带与页脚 */
    @media (max-width: 720px) {
      .case-page .mobile-play { display: none; }
      .case-page .mobile-play.is-visible { display: inline-flex; }
      /* 手机端视频只占一行里的三分之一，控件同比缩小，避免遮挡画面 */
      .case-gallery .slot-play { width: clamp(26px, 30%, 44px); }
      .case-gallery .case-media-slot .case-sound {
        right: 6px;
        bottom: 6px;
        width: 26px;
        height: 26px;
      }
      .case-gallery .case-media-slot .case-sound svg { width: 13px; height: 13px; }
    }

    /* 右下角声音开关：纯图标，点击在「有声 / 静音」之间切换 */
    .case-media-slot .case-sound {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .36);
      border-radius: 50%;
      background: rgba(8, 7, 10, .72);
      color: #ffffff;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .case-media-slot .case-sound svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .case-media-slot .case-sound .case-sound-on { display: none; }
    .case-media-slot .case-sound[aria-pressed="true"] .case-sound-on { display: block; }
    .case-media-slot .case-sound[aria-pressed="true"] .case-sound-off { display: none; }
    .case-media-slot .case-sound:hover { background: rgba(8, 7, 10, .92); border-color: rgba(255, 255, 255, .62); }
    .case-media-slot .case-sound[aria-pressed="true"] {
      background: rgba(255, 255, 255, .94);
      border-color: transparent;
      color: #08070a;
    }

    /* 回声带上方的分割线：与图集 6px 缝同一节奏，只做轻微分隔 */
    .case-body .case-divider.case-echo-divider {
      margin: 6px 0;
    }

    @media (max-width: 720px) {
      .case-body .case-divider.case-echo-divider { margin: 4px 0; }
    }

    /* 空灯箱：还没填内容时的占位框，虚线 + 对角线 */
    .case-frame--empty {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px dashed color-mix(in srgb, var(--text) 24%, transparent);
      background: color-mix(in srgb, var(--text) 4%, transparent);
    }
    .case-frame--empty::before,
    .case-frame--empty::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .case-frame--empty::before {
      background: linear-gradient(
        to top right,
        transparent calc(50% - 0.5px),
        color-mix(in srgb, var(--text) 12%, transparent) calc(50% - 0.5px),
        color-mix(in srgb, var(--text) 12%, transparent) calc(50% + 0.5px),
        transparent calc(50% + 0.5px)
      );
    }
    .case-frame--empty::after {
      background: linear-gradient(
        to bottom right,
        transparent calc(50% - 0.5px),
        color-mix(in srgb, var(--text) 12%, transparent) calc(50% - 0.5px),
        color-mix(in srgb, var(--text) 12%, transparent) calc(50% + 0.5px),
        transparent calc(50% + 0.5px)
      );
    }

  </style>

      var currentLanguage = "zh";

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>

  <script>
    (function () {
      var slots = Array.prototype.slice.call(document.querySelectorAll(".case-media-slot[data-video]"));
      if (!slots.length) return;

      var mobileQuery = window.matchMedia("(max-width: 720px)");

      function attach(slot) {
        var video = slot.querySelector("video");
        var src = slot.getAttribute("data-video");
        // 手机端优先用低码率版本，保证小屏播放流畅
        var mobileSrc = slot.getAttribute("data-mobile-video");
        if (mobileSrc && mobileQuery.matches) src = mobileSrc;
        if (!video || !src) return null;
        video.loop = false; // 只播一次：结束后停在末帧，末帧与静图呼应
        if (video.getAttribute("src") !== src) {
          video.setAttribute("src", src);
          try { video.load(); } catch (error) {}
        }
        return video;
      }

      function isSoundOn(slot) {
        var button = slot.querySelector(".case-sound");
        return !!button && button.getAttribute("aria-pressed") === "true";
      }

      function play(slot, manual) {
        var video = attach(slot);
        if (!video) return;
        var replayOnEnter = slot.getAttribute("data-replay") === "enter";
        // 手机端普通视频仍不自动播；快剪允许每次入场自动播放
        if (!manual && mobileQuery.matches && slot.dataset.finished === "1" && !replayOnEnter) return;
        if (manual || replayOnEnter) delete slot.dataset.finished;
        if (!video.paused && !video.ended) return;
        try { video.currentTime = 0; } catch (error) {}
        video.muted = !isSoundOn(slot);
        var promise = video.play();
        if (promise && promise.catch) promise.catch(function () {});
      }

      function stop(slot) {
        var video = slot.querySelector("video");
        if (video && !video.paused) video.pause();
        slot.classList.remove("is-playing");
      }

      function syncSoundLabel(slot, on) {
        var button = slot.querySelector(".case-sound");
        if (!button) return;
        var language = document.documentElement.lang || "zh-CN";
        var english = language.indexOf("en") === 0;
        button.setAttribute("aria-label", on ? (english ? "Mute the video" : "关闭声音") : (english ? "Play with sound" : "打开声音"));
      }

      slots.forEach(function (slot) {
        var video = slot.querySelector("video");
        if (!video) return;

        video.addEventListener("playing", function () {
          slot.classList.add("is-playing");
        });

        video.addEventListener("ended", function () {
          slot.classList.remove("is-playing");
          slot.dataset.finished = "1";
        });

        // 手机端：按钮直接播放这块动画（点整块也能播，按钮是给出手势入口）
        var playButton = slot.querySelector(".slot-play");
        if (playButton) {
          playButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            play(slot, true);
          });
        }

        var sound = slot.querySelector(".case-sound");
        if (sound) {
          sound.addEventListener("click", function (event) {
            event.stopPropagation();
            var target = attach(slot);
            if (!target) return;
            var on = sound.getAttribute("aria-pressed") !== "true";
            sound.setAttribute("aria-pressed", on ? "true" : "false");
            syncSoundLabel(slot, on);
            target.muted = !on;
            if (target.ended || target.paused) {
              delete slot.dataset.finished;
              try { target.currentTime = 0; } catch (error) {}
              var promise = target.play();
              if (promise && promise.catch) promise.catch(function () {});
            }
          });
        }

        // 点击 = 手动重播（触屏设备没有悬停，也能重看）
        slot.addEventListener("click", function () { play(slot, true); });
      });

      if (!("IntersectionObserver" in window)) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var slot = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
            if (slot.getAttribute("data-replay") === "enter") {
              // 快剪：每次入场自动播放；播完后再次入场从头重播
              play(slot);
            } else if (!mobileQuery.matches && slot.dataset.autoplayed !== "1") {
              // 其余视频：只在桌面端首次入场自动播放
              slot.dataset.autoplayed = "1";
              play(slot);
            }
          } else if (!entry.isIntersecting) {
            // 手机端已开始的动画继续播完，不因滚动离开视口而中断
            if (!mobileQuery.matches) stop(slot);
          }
        });
      }, { threshold: [0, 0.35] });

      slots.forEach(function (slot) { observer.observe(slot); });

      // 手机端「一键播放」：只播当前在视野里的动画，按钮仅在页面上有动画时才浮出。
      var playAllButton = document.querySelector(".mobile-play");
      if (playAllButton && window.matchMedia("(max-width: 720px)").matches) {
        var visibleSlots = [];
        function syncPlayAll() {
          playAllButton.classList.toggle("is-visible", visibleSlots.length > 0);
        }
        var buttonObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var index = visibleSlots.indexOf(entry.target);
            if (entry.isIntersecting && entry.intersectionRatio >= 0.25) {
              if (index < 0) visibleSlots.push(entry.target);
            } else if (index > -1) {
              visibleSlots.splice(index, 1);
            }
          });
          syncPlayAll();
        }, { threshold: [0, 0.25] });

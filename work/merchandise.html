    /* 挑战杯正面图 + 三视图：同一行双栏 */
    .merch-cup-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;

    .case-body .merch-cup-pair > .case-frame { margin: 0 !important; }

      display: grid;
      grid-template-columns: calc(27.27% - 1.64px) minmax(0, 1fr);
      gap: 6px;
      align-items: stretch;
      margin-top: 6px;
    }

    .case-body .merch-video-pair > .case-frame { margin: 0 !important; }

    .merch-video-pair .case-frame--image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .merch-video-frame {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px dashed color-mix(in srgb, var(--text) 24%, transparent);
      background: color-mix(in srgb, var(--text) 4%, transparent);
    }

    .merch-video-play {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 50%;
      background: rgba(12, 11, 15, 0.62);
      color: #ffffff;
    }

    .merch-video-play svg {
      width: 22px;
      height: 22px;
      margin-left: 3px;
    }

    @media (max-width: 720px) {
      .merch-video-pair { grid-template-columns: 1fr; }
    }

    /* S9 连帽衫：左侧主图放大，右侧两张上下叠放 */
    .case-row[data-layout="hero-stack"] {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 6px;
      align-items: stretch;
    }

    .case-row[data-layout="hero-stack"] > .case-frame { margin: 0; }

    .case-body .case-row[data-layout="hero-stack"] .case-frame { margin: 0; }

    .case-row[data-layout="hero-stack"] .case-frame--image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .case-stack {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      min-height: 0;
    }

    .case-stack > .case-frame { margin: 0; min-height: 0; }

    /* S10 工作服：左侧大图 + 右侧三张（神威 / 勇武 / 精锐）上到下 */
    .merch-jersey-row {
      display: grid;
      grid-template-columns: calc(75% + 0.83px) minmax(0, 1fr);
      gap: 6px;
      align-items: stretch;
      margin-top: 6px;
    }

    .case-body .merch-jersey-row > .case-frame,
    .case-body .merch-jersey-row figure { margin: 0 !important; }

    .merch-jersey-row > .case-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .case-stack--three {
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 6px;
      min-height: 0;
    }

    .case-stack--three > figure { margin: 0 !important; min-height: 0; }

    (function () {
      var STORAGE_KEY = "portfolio-language";
      var copy = {

          footerNote: "影子 · 视觉设计作品集",
          pageTitle: "周边物料 · 奖杯、奖牌与礼盒 | Shadowyli",
          metaDescription: "周边物料案例：挑战杯奖杯、星芒争锋赛奖牌，《梦幻西游》手游巅峰联赛 S10 徽章礼盒、帆布袋、工作服与三组选手服 3D 渲染与包装设计。"

        en: {

        }
      };

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        var ariaNodes = document.querySelectorAll("[data-i18n-aria]");
        for (var k = 0; k < ariaNodes.length; k++) {
          var ariaLabel = dictionary[ariaNodes[k].getAttribute("data-i18n-aria")];
          if (typeof ariaLabel === "string") ariaNodes[k].setAttribute("aria-label", ariaLabel);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();
  </script>
  <script>
    (function () {

      if (!document.querySelector(".case-section")) {

      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      dialog.addEventListener("click", closeDialog);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();

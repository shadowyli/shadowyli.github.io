  <style>
    /* 空白案例页：内容未填时让页脚落在视口底部 */
    @media (min-width: 721px) {
      body.case-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .case-main { flex: 1; }
    }

    main.case-main { padding-bottom: clamp(16px, 2vw, 24px); }

    /* 页首署名：与站内其他案例页保持一致 */
    .case-body .voice {
      position: relative;
      display: block;
      margin: 0 0 clamp(22px, 2.6vw, 32px);
      padding: clamp(14px, 1.6vw, 20px) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--text) 13%, transparent);
    }

    .voice-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(12px, 1.5vw, 20px);
      padding: 0;
      min-height: 26px;
    }

    .case-body .voice-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: none;
      flex: none;
      margin: 0;
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.6;
    }

    .voice-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .voice-author {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.1vw, 13px);
      min-height: 26px;
    }

    .voice-rule {
      display: block;
      flex: none;
      width: 22px;
      height: 1px;
      margin: 0;
      background: color-mix(in srgb, var(--text) 45%, transparent);
    }

    .case-body .voice-name {
      margin: 0;
      max-width: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .case-body .voice-credit {
      margin: 0;
      max-width: none;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.2;
    }

    @media (max-width: 720px) {
      .case-body .voice { padding: 16px 0; }
    }

    /* 01 模块：开场分镜，一行 5 张 */
    .nbpl-opening-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    /* 覆盖全局相邻图片的 6px 上边距，保证网格内所有图片顶对齐 */
    .case-page .case-section .nbpl-opening-grid > .case-frame { margin: 0; }

    .nbpl-opening-grid .case-frame--image img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 720px) {
      .nbpl-opening-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .nbpl-opening-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* 02 模块：蛋仔麦克疯包装，一行四个 */
    .egg-mic-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .case-page .case-section .egg-mic-grid > .case-frame { margin: 0; }

    .egg-mic-grid .case-frame--image img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 720px) {
      .egg-mic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

  <script>
    (function () {
      var STORAGE_KEY = "portfolio-language";
      var copy = {
        zh: {
          skip: "跳到正文",
          back: "← 返回作品集",
          contactMe: "联系我",
          navWork: "作品",
          navAbout: "关于我",
          pageHeading: "视频包装",
          voiceLabel: "视频包装",
          voicePill: "视频包装",
          voiceName: "影子（李颖）",
          voiceCredit: "3D & 视觉创意设计：",
          section1Title: "永劫无间 NBPL 夏季赛常规赛开场",
          section2Title: "《蛋仔派对》麦克疯 · 视频包装",
          closeDialog: "关闭",
          wechatTitle: "微信二维码",
          saveHint: "长按图片保存二维码",
          footerNote: "影子 · 视觉设计作品集",
          pageTitle: "视频包装 | Shadowyli",
          metaDescription: "视频包装项目案例。"
        },
        en: {
          skip: "Skip to content",
          back: "← Back to portfolio",
          contactMe: "Contact me",
          navWork: "Work",
          navAbout: "About",
          pageHeading: "Video Packaging",
          voiceLabel: "Video Packaging",
          voicePill: "VIDEO PACKAGING",
          voiceName: "Shadow (Li Ying)",
          voiceCredit: "3D & Visual Creative Design: ",
          section1Title: "Naraka: Bladepoint NBPL Summer Split Opening",
          section2Title: "Eggy Party Mic Check · Video Packaging",
          closeDialog: "Close",
          wechatTitle: "WeChat QR code",
          saveHint: "Long-press the image to save the QR code",
          footerNote: "Shadow · Visual Design Portfolio",
          pageTitle: "Video Packaging | Shadowyli",
          metaDescription: "Video packaging case study."
        }
      };

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");
      var themeButton = document.querySelector(".case-theme");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function syncThemeLabel() {
        if (!themeButton) return;
        var light = document.documentElement.dataset.theme === "light";
        var english = currentLanguage === "en";
        var label = light
          ? (english ? "Switch to dark mode" : "切换到深色模式")
          : (english ? "Switch to light mode" : "切换到浅色模式");
        themeButton.setAttribute("aria-label", label);
        themeButton.setAttribute("title", label);
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var ariaNodes = document.querySelectorAll("[data-i18n-aria]");
        for (var j = 0; j < ariaNodes.length; j++) {
          var label = dictionary[ariaNodes[j].getAttribute("data-i18n-aria")];
          if (typeof label === "string") ariaNodes[j].setAttribute("aria-label", label);
        }

        var frameImages = document.querySelectorAll("[data-frame-index]");
        for (var k = 0; k < frameImages.length; k++) {
          var frameIndex = frameImages[k].getAttribute("data-frame-index");
          frameImages[k].setAttribute("alt", language === "zh"
            ? "《永劫无间》NBPL 夏季赛常规赛开场 · 分镜 " + frameIndex
            : "Naraka: Bladepoint NBPL Summer Split opening · frame " + frameIndex);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }

        syncThemeLabel();
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }

      if (themeButton) {
        themeButton.addEventListener("click", function () {
          var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          if (next === "light") {
            document.documentElement.dataset.theme = "light";
          } else {
            delete document.documentElement.dataset.theme;
          }
          try {
            localStorage.setItem("portfolio-theme", next);
          } catch (error) { /* ignore */ }
          syncThemeLabel();
        });
      }
    })();
  </script>
  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");
      var lastFocus = null;

      function openDialog() {
        lastFocus = document.activeElement;
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        var returnTo = lastFocus && lastFocus !== document.body ? lastFocus : trigger;
        if (returnTo && typeof returnTo.focus === "function") returnTo.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) closeDialog();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>

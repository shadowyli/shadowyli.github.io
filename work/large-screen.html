  <script>
    (function () {
      var THEMES = {
        champion: {
          render: "../assets/stage-render-champion.webp",
          flat: "../assets/flat-champion.webp"
        },
        entrance: { render: "", flat: "" },
        matchup: { render: "", flat: "" },
        opening: { render: "", flat: "" }
      };

      var buttons = Array.prototype.slice.call(document.querySelectorAll(".theme-switch button"));
      var cards = {
        render: document.querySelector('.stage-card[data-card="render"]'),
        flat: document.querySelector('.stage-card[data-card="flat"]')
      };
      if (!buttons.length || !cards.render || !cards.flat) return;

      // 只暴露素材齐备的主题：缺 render 或 flat 的主题不进 tablist，
      // 只剩一个可用主题时整排切换器隐藏（避免 “素材待补” 空态上线）。
      var ready = buttons.filter(function (button) {
        var theme = THEMES[button.getAttribute("data-theme-id")];
        return !!(theme && theme.render && theme.flat);
      });
      buttons.forEach(function (button) {
        if (ready.indexOf(button) === -1) button.parentNode.removeChild(button);
      });
      if (!ready.length) return;
      buttons = ready;
      if (buttons.length < 2) {
        var switcher = document.querySelector(".theme-switch");
        if (switcher) {
          switcher.hidden = true;
          switcher.style.display = "none";
        }
        buttons.forEach(function (button, index) {
          button.setAttribute("aria-selected", index === 0 ? "true" : "false");
        });
      }

      function activeButton() {
        return document.querySelector('.theme-switch button[aria-selected="true"]');
      }

      function syncNames() {
        var active = activeButton();
        var name = active ? active.textContent.trim() : "";
        var nodes = document.querySelectorAll("[data-theme-name]");
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = name;
      }
      window.__stageSync = syncNames;

      function swap(card, kind, url) {
        var media = card.querySelector(".stage-media");
        var layers = card.querySelectorAll(".stage-layer");
        var empty = media.querySelector(".stage-empty");
        var current = null;
        var next = null;
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].classList.contains("is-current")) current = layers[i];
          else next = layers[i];
        }

        if (!url) {
          empty.hidden = false;
          if (current) {
            current.classList.remove("is-current");
            current.classList.add("is-leaving");
          }
          return;
        }

        empty.hidden = true;
        if (!next) return;

        var probe = new Image();
        probe.onload = function () {
          next.classList.remove("is-leaving");
          next.src = url;
          var tag = card.querySelector(".stage-tag");
          var active = activeButton();
          next.alt = (tag ? tag.textContent.trim() : "") + " · " + (active ? active.textContent.trim() : "");
          next.removeAttribute("aria-hidden");
          void next.offsetWidth;
          next.classList.add("is-current");
          if (current && current !== next) {
            current.classList.remove("is-current");
            current.classList.add("is-leaving");
            current.setAttribute("aria-hidden", "true");
          }
        };
        probe.src = url;
      }

      function applyTheme(id) {
        var theme = THEMES[id];
        if (!theme) return;
        swap(cards.render, "render", theme.render);
        swap(cards.flat, "flat", theme.flat);
        syncNames();
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          if (button.getAttribute("aria-selected") === "true") return;
          buttons.forEach(function (other) {
            other.setAttribute("aria-selected", other === button ? "true" : "false");
          });
          applyTheme(button.getAttribute("data-theme-id"));
        });
      });

      syncNames();
    })();
  </script>

      var currentLanguage = "zh";
      var languageToggle = document.querySelector(".case-lang");

      function storedLanguage() {
        try {
          return localStorage.getItem(STORAGE_KEY) === "en" ? "en" : "zh";
        } catch (error) {
          return "zh";
        }
      }

      function labelFor(language) {
        return language === "zh" ? "切换到英文" : "Switch to Chinese";
      }

      function applyLanguage(language) {
        currentLanguage = language;
        var dictionary = copy[language];
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";

        var textNodes = document.querySelectorAll("[data-i18n-key]");
        for (var i = 0; i < textNodes.length; i++) {
          var text = dictionary[textNodes[i].getAttribute("data-i18n-key")];
          if (typeof text === "string") textNodes[i].textContent = text;
        }

        var altNodes = document.querySelectorAll("[data-i18n-alt]");
        for (var j = 0; j < altNodes.length; j++) {
          var alt = dictionary[altNodes[j].getAttribute("data-i18n-alt")];
          if (typeof alt === "string") altNodes[j].setAttribute("alt", alt);
        }

        var ariaNodes = document.querySelectorAll("[data-i18n-aria]");
        for (var k = 0; k < ariaNodes.length; k++) {
          var label = dictionary[ariaNodes[k].getAttribute("data-i18n-aria")];
          if (typeof label === "string") ariaNodes[k].setAttribute("aria-label", label);
        }

        document.title = dictionary.pageTitle;
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content", dictionary.metaDescription);

        if (typeof window.__stageSync === "function") window.__stageSync();

        if (languageToggle) {
          languageToggle.textContent = language === "zh" ? "EN" : "CN";
          languageToggle.setAttribute("aria-label", labelFor(language));
          languageToggle.setAttribute("title", labelFor(language));
        }
      }

      applyLanguage(storedLanguage());

      if (languageToggle) {
        languageToggle.addEventListener("click", function () {
          var nextLanguage = currentLanguage === "zh" ? "en" : "zh";
          try {
            localStorage.setItem(STORAGE_KEY, nextLanguage);
          } catch (error) { /* ignore */ }
          applyLanguage(nextLanguage);
        });
      }
    })();
  </script>
  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        var percent = (progress * 100).toFixed(2) + "%";
        bar.style.setProperty("--progress", percent);
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>
    (function () {
      var button = document.querySelector(".case-theme");
      var video = document.querySelector(".case-frame-video");
      var frame = document.querySelector(".case-frame-inner");
      var playButton = document.querySelector(".case-video-play");

      if (video && frame) {
        if (window.matchMedia("(max-width: 720px)").matches) {
          video.src = "../assets/large-screen-live-mobile.mp4";
          video.load();
        }

        var tryPlay = function () {
          var promise = video.play();
          if (promise && promise.catch) promise.catch(function () {
            frame.classList.add("is-paused");
          });
        };

        video.addEventListener("playing", function () {
          frame.classList.remove("is-paused");
        });
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          video.addEventListener("click", function () {
            if (video.paused) tryPlay();
          });
          if (playButton) playButton.addEventListener("click", tryPlay);
        }
        tryPlay();
      }

      if (!button) return;

      function label(theme) {
        var english = document.documentElement.lang === "en";
        if (theme === "light") return english ? "Switch to dark mode" : "切换到深色模式";
        return english ? "Switch to light mode" : "切换到浅色模式";
      }

      function apply(theme) {
        if (theme === "light") {
          document.documentElement.dataset.theme = "light";
        } else {
          delete document.documentElement.dataset.theme;
        }
        button.setAttribute("aria-label", label(theme));
        button.setAttribute("title", label(theme));
      }

      apply(document.documentElement.dataset.theme === "light" ? "light" : "dark");

      button.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        try {
          localStorage.setItem("portfolio-theme", next);
        } catch (error) { /* ignore */ }
        apply(next);
      });
    })();
  </script>
  <script>
    (function () {
      var trigger = document.querySelector("#case-contact");
      var dialog = document.querySelector("#case-contact-dialog");
      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");
        trigger.focus();
      }

      trigger.addEventListener("click", openDialog);
      if (closeButton) closeButton.addEventListener("click", closeDialog);
      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) closeDialog();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();
  </script>
  <script>
    (function () {
      var videos = document.querySelectorAll(".case-slot-video");
      if (!videos.length) return;
      var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      Array.prototype.forEach.call(videos, function (video) {
        var figure = video.closest("figure");
        var inView = false;

        function showVideo() {
          if (figure) figure.classList.add("is-playing");
        }

        function hideVideo() {
          if (figure) figure.classList.remove("is-playing");
        }

        function play() {
          video.muted = true;
          showVideo();
          var promise = video.play();
          if (promise && promise.catch) promise.catch(function () {
            hideVideo();
          });
        }

        function stop() {
          video.pause();
          video.currentTime = 0;
          hideVideo();
        }

        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting && !inView) {
              inView = true;
              play();
            } else if (!entry.isIntersecting && inView) {
              inView = false;
              stop();
            }
          });
        }, { threshold: 0.5 });
        observer.observe(video);

        if (canHover) {
          figure.addEventListener("pointerenter", play);
          figure.addEventListener("pointerleave", stop);
        }

        video.addEventListener("ended", function () {
          video.currentTime = 0;
          hideVideo();
        });
      });
    })();
  </script>
</body>

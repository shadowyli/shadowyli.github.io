    /* 查看更多：展开式画廊——悬停 / 聚焦的一张展开，其余收成窄条 */
    .more-gallery {
      display: flex;
      gap: 6px;
      height: clamp(104px, 12vw, 152px);
    }

    .more-item {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
      border-radius: 6px;
      background: var(--surface);
      color: #ffffff;
      text-decoration: none;
      transition: flex-grow 520ms cubic-bezier(.22, .8, .24, 1);
    }

    .more-item img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.5) saturate(.75);
      transform: scale(1.06);
      transition: filter 420ms ease, transform 800ms cubic-bezier(.22, .8, .24, 1);
    }

    .more-item.is-active img { filter: none; transform: scale(1); }

    .more-item::after {
      position: absolute;
      inset: 30% 0 0;
      background: linear-gradient(to top, rgba(8, 7, 10, .82), transparent);
      content: "";
      opacity: 0;
      transition: opacity 360ms ease;
    }

    .more-item.is-active::after { opacity: 1; }

    .more-label {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 11px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 240ms ease, transform 360ms ease;
    }

    .more-item.is-active .more-label {
      opacity: 1;
      transform: none;
      transition-delay: 180ms;
    }

    .more-label > span:first-child { min-width: 0; }
    .more-arrow { flex: none; transition: transform 240ms ease; }
    .more-item.is-active:hover .more-arrow { transform: translateX(4px); }

    .more-item:focus-visible {
      outline: 1px solid color-mix(in srgb, var(--text) 60%, transparent);
      outline-offset: 3px;
    }

    @media (max-width: 720px) {
      .more-gallery { height: 88px; gap: 4px; }
      .more-item { border-radius: 4px; }
      .more-label { left: 10px; right: 10px; bottom: 8px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .more-item, .more-item img, .more-label { transition: none; }
    }

  </style>

  <script>
    (function () {
      var THEMES = {
        champion: {
          render: "../assets/stage-render-champion.webp",
          flat: "../assets/flat-champion.webp"
        },
        entrance: { render: "", flat: "" },
        matchup: { render: "", flat: "" },
        opening: { render: "", flat: "" }
      };

      var buttons = Array.prototype.slice.call(document.querySelectorAll(".theme-switch button"));
      var cards = {
        render: document.querySelector('.stage-card[data-card="render"]'),
        flat: document.querySelector('.stage-card[data-card="flat"]')
      };
      if (!buttons.length || !cards.render || !cards.flat) return;

      // 只暴露素材齐备的主题：缺 render 或 flat 的主题不进 tablist，
      // 只剩一个可用主题时整排切换器隐藏（避免 “素材待补” 空态上线）。
      var ready = buttons.filter(function (button) {
        var theme = THEMES[button.getAttribute("data-theme-id")];
        return !!(theme && theme.render && theme.flat);
      });
      buttons.forEach(function (button) {
        if (ready.indexOf(button) === -1) button.parentNode.removeChild(button);
      });
      if (!ready.length) return;
      buttons = ready;
      if (buttons.length < 2) {
        var switcher = document.querySelector(".theme-switch");
        if (switcher) {
          switcher.hidden = true;
          switcher.style.display = "none";
        }
        buttons.forEach(function (button, index) {
          button.setAttribute("aria-selected", index === 0 ? "true" : "false");
        });
      }

      function activeButton() {
        return document.querySelector('.theme-switch button[aria-selected="true"]');
      }

      function syncNames() {
        var active = activeButton();
        var name = active ? active.textContent.trim() : "";
        var nodes = document.querySelectorAll("[data-theme-name]");
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = name;
      }
      window.__stageSync = syncNames;

      function swap(card, kind, url) {
        var media = card.querySelector(".stage-media");
        var layers = card.querySelectorAll(".stage-layer");
        var empty = media.querySelector(".stage-empty");
        var current = null;
        var next = null;
        for (var i = 0; i < layers.length; i++) {
          if (layers[i].classList.contains("is-current")) current = layers[i];
          else next = layers[i];
        }

        if (!url) {
          empty.hidden = false;
          if (current) {
            current.classList.remove("is-current");
            current.classList.add("is-leaving");
          }
          return;
        }

        empty.hidden = true;
        if (!next) return;

        var probe = new Image();
        probe.onload = function () {
          next.classList.remove("is-leaving");
          next.src = url;
          var tag = card.querySelector(".stage-tag");
          var active = activeButton();
          next.alt = (tag ? tag.textContent.trim() : "") + " · " + (active ? active.textContent.trim() : "");
          next.removeAttribute("aria-hidden");
          void next.offsetWidth;
          next.classList.add("is-current");
          if (current && current !== next) {
            current.classList.remove("is-current");
            current.classList.add("is-leaving");
            current.setAttribute("aria-hidden", "true");
          }
        };
        probe.src = url;
      }

      function applyTheme(id) {
        var theme = THEMES[id];
        if (!theme) return;
        swap(cards.render, "render", theme.render);
        swap(cards.flat, "flat", theme.flat);
        syncNames();
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          if (button.getAttribute("aria-selected") === "true") return;
          buttons.forEach(function (other) {
            other.setAttribute("aria-selected", other === button ? "true" : "false");
          });
          applyTheme(button.getAttribute("data-theme-id"));
        });
      });

      syncNames();
    })();
  </script>

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        var percent = (progress * 100).toFixed(2) + "%";
        bar.style.setProperty("--progress", percent);
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>

        document.addEventListener("WeixinJSBridgeReady", function () {
          if (video.paused) tryPlay();
        }, false);
        tryPlay();
        window.setTimeout(function () {
          if (video.paused) frame.classList.add("is-paused");

  <script>
    (function () {
      var mobile = window.matchMedia("(max-width: 720px)").matches;
      var MAX_ATTACHED = 6;
      var videos = Array.prototype.slice.call(document.querySelectorAll("video[data-src]"));
      if (!videos.length) return;

      function targetSrc(video) {
        var mobileSrc = video.getAttribute("data-mobile-src");
        if (mobile && mobileSrc) return mobileSrc;
        return video.getAttribute("data-src");
      }

      function attach(video) {
        var src = targetSrc(video);
        if (!src) return;
        if (video.getAttribute("src") === src) return;
        video.setAttribute("src", src);
        try {
          video.load();
        } catch (error) {}
      }

      function release(video) {
        if (!video.getAttribute("src")) return;
        if (!video.paused) return;
        if (video.closest(".is-playing")) return;
        video.removeAttribute("src");
        try {
          video.load();
        } catch (error) {}
      }

      function offset(video) {
        var rect = video.getBoundingClientRect();
        return rect.top < 0 ? -rect.bottom : rect.top;
      }

      function trim() {
        var attached = videos.filter(function (video) {
          return !!video.getAttribute("src");
        });
        while (attached.length > MAX_ATTACHED) {
          attached.sort(function (a, b) {
            return Math.abs(offset(a)) - Math.abs(offset(b));
          });
          var victim = null;
          for (var i = attached.length - 1; i >= 0; i--) {
            if (attached[i].paused) {
              victim = attached[i];
              break;
            }
          }
          if (!victim) return;
          release(victim);
          attached = attached.filter(function (video) {
            return video !== victim;
          });
        }
      }

      var nativePlay = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function () {
        attach(this);
        return nativePlay.apply(this, arguments);
      };

      var ticking = false;

      function refresh() {
        ticking = false;
        var viewport = window.innerHeight || document.documentElement.clientHeight;
        videos.forEach(function (video) {
          var rect = video.getBoundingClientRect();
          if (rect.bottom > -viewport * 0.5 && rect.top < viewport * 1.5) {
            attach(video);
          } else if (rect.bottom < -viewport * 1.5 || rect.top > viewport * 2.5) {
            release(video);
          }
        });
        trim();
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(refresh);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      window.addEventListener("load", request);
      refresh();
    })();
  </script>
  <script>
    (function () {
      var videos = document.querySelectorAll(".case-slot-video");
      if (!videos.length) return;
      var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      var items = [];

      Array.prototype.forEach.call(videos, function (video) {
        var figure = video.closest("figure");
        var item = { video: video, visible: false };

        function showVideo() {
          if (figure) figure.classList.add("is-playing");
        }

        function hideVideo() {
          if (figure) figure.classList.remove("is-playing");
        }

        function play() {
          video.muted = true;
          showVideo();
          var promise = video.play();
          if (promise && promise.catch) promise.catch(function () {
            hideVideo();
          });
        }

        function stop() {
          video.pause();
          video.currentTime = 0;
          hideVideo();
        }

        item.play = play;
        item.stop = stop;
        items.push(item);

        if (canHover) {
          figure.addEventListener("pointerenter", play);
          figure.addEventListener("pointerleave", stop);
        } else {
          video.addEventListener("click", function () {
            if (video.paused) play();
          });
        }

        document.addEventListener("WeixinJSBridgeReady", function () {
          if (item.visible && video.paused) play();
        }, false);

        video.addEventListener("ended", function () {
          video.currentTime = 0;
          hideVideo();
        });
      });

      function isVisible(element) {
        var rect = element.getBoundingClientRect();
        var viewport = window.innerHeight || document.documentElement.clientHeight;
        var overlap = Math.min(rect.bottom, viewport) - Math.max(rect.top, 0);
        return overlap > Math.min(rect.height, viewport) * 0.5;
      }

      var ticking = false;

      function update() {
        ticking = false;
        items.forEach(function (item) {
          var visible = isVisible(item.video);
          if (visible && !item.visible) {
            item.visible = true;
            item.play();
          } else if (!visible && item.visible) {
            item.visible = false;
            item.stop();
          }
        });
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      update();
    })();
  </script>
  <script>
    (function () {
      var videos = document.querySelectorAll(".case-hero-video");
      if (!videos.length) return;

      Array.prototype.forEach.call(videos, function (video) {
        var frame = video.closest(".case-hero-media");
        var button = frame ? frame.querySelector(".case-hero-play") : null;
        var mobileSrc = video.getAttribute("data-mobile-src");
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
          video.loop = true;
        } else {
          video.loop = false;
        }

        if (mobileSrc && window.matchMedia("(max-width: 720px)").matches) {
          video.src = mobileSrc;
        }

        function show() {
          if (frame) {
            frame.classList.add("is-playing");
            frame.classList.remove("is-paused");
          }
        }

        function play() {
          video.muted = true;
          var promise = video.play();
          if (promise && promise.then) {
            promise.then(show).catch(function () {
              if (frame) frame.classList.add("is-blocked");
            });
          } else {
            show();
          }
        }

        video.addEventListener("playing", function () {
          show();
          if (frame) frame.classList.remove("is-blocked");
        });

        video.addEventListener("ended", function () {
          video.currentTime = 0;
          if (!frame) return;
          frame.classList.remove("is-playing");
          frame.classList.add("is-paused");
        });

        if (button) button.addEventListener("click", play);

        // 手机端：按下即开始（部分浏览器 click 的播放权限会被回收），并允许点整块主视觉触发
        function gesturePlay(event) {
          if (event && event.cancelable) event.preventDefault();
          if (video.readyState === 0) {
            try { video.load(); } catch (error) {}
          }
          video.muted = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          play();
        }

        if (button) {
          button.addEventListener("pointerdown", gesturePlay, { passive: false });
          button.addEventListener("touchstart", gesturePlay, { passive: false });
        }

        if (frame) {
          frame.addEventListener("click", function (event) {
            if (!frame.classList.contains("is-blocked")) return;
            gesturePlay(event);
          });
        }

        document.addEventListener("WeixinJSBridgeReady", play, false);

        var started = false;

        function maybePlay() {
          if (started) return;
          var rect = video.getBoundingClientRect();
          var viewport = window.innerHeight || document.documentElement.clientHeight;
          if (rect.bottom < -viewport * 0.5 || rect.top > viewport * 1.2) return;
          started = true;
          play();
        }

        window.addEventListener("scroll", maybePlay, { passive: true });
        window.addEventListener("load", maybePlay);
        maybePlay();
      });
    })();
  </script>
  <script>
    (function () {
      var button = document.querySelector(".mobile-play");
      if (!button) return;
      if (!window.matchMedia("(max-width: 720px)").matches) return;

      function isVisible(element) {
        var rect = element.getBoundingClientRect();
        var viewport = window.innerHeight || document.documentElement.clientHeight;
        var overlap = Math.min(rect.bottom, viewport) - Math.max(rect.top, 0);
        return overlap > Math.min(rect.height, viewport) * 0.3;
      }

      button.addEventListener("click", function () {
        var videos = document.querySelectorAll("video");
        Array.prototype.forEach.call(videos, function (video) {
          if (!isVisible(video)) return;
          video.muted = true;
          var media = video.closest(".case-hero-media, .case-slot-media");
          if (media) media.classList.add("is-playing");
          var frame = video.closest(".case-frame-inner");
          if (frame) frame.classList.remove("is-paused");
          var promise = video.play();
          if (promise && promise.catch) promise.catch(function () {});
        });
      });
    })();
  </script>
  <script>
    (function () {
      var gallery = document.querySelector(".more-gallery");
      if (!gallery) return;
      var items = Array.prototype.slice.call(gallery.querySelectorAll(".more-item"));
      var RATIO = 16 / 9;
      var active = null;

      function gapSize() {
        var cs = getComputedStyle(gallery);
        return parseFloat(cs.columnGap || cs.gap) || 0;
      }

      function growFor(item) {
        var n = items.length;
        var gap = gapSize();
        var inner = gallery.clientWidth - gap * (n - 1);
        var target = gallery.clientHeight * RATIO;
        if (inner <= 0 || target <= 0) return 1;
        var rest = inner - target;
        if (rest <= 0) return 1;
        return Math.max(0.4, (target * (n - 1)) / rest);
      }

      function clear() {
        active = null;
        items.forEach(function (item) {
          item.classList.remove("is-active");
          item.style.flexGrow = "";
        });
      }

      function activate(item) {
        active = item;
        var grow = growFor(item);
        items.forEach(function (other) {
          if (other === item) {
            other.classList.add("is-active");
            other.style.flexGrow = String(grow.toFixed(3));
          } else {
            other.classList.remove("is-active");
            other.style.flexGrow = "1";
          }
        });
      }

      items.forEach(function (item) {
        item.addEventListener("mouseenter", function () { activate(item); });
        item.addEventListener("focus", function () { activate(item); });
        item.addEventListener("click", function (event) {
          if (!item.classList.contains("is-active")) {
            event.preventDefault();
            activate(item);
          }
        });
      });

      gallery.addEventListener("mouseleave", function () {
        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) clear();
      });

      window.addEventListener("resize", function () {
        if (active) activate(active);
      });
    })();
  </script>

  <script>
    // 案例之间左右切换（按首页作品顺序，只保留已有子页面的项）
    (function () {
      var order = [
        { id: "campaign", label: { zh: "宣发设计", en: "Campaign Design" } },
        { id: "large-screen", label: { zh: "大屏视觉", en: "Large-Screen Visuals" } }
      ];
      var here = "large-screen";
      var index = order.findIndex(function (item) { return item.id === here; });
      if (index < 0) return;

      var prev = order[index - 1] || null;
      var next = order[index + 1] || null;
      if (!prev && !next) return;

      var zh = (document.documentElement.lang || "zh").toLowerCase().indexOf("en") !== 0;
      function label(item) { return item ? item.label[zh ? "zh" : "en"] : ""; }
      function href(item) { return item.id + ".html"; }

      var hint = document.createElement("div");
      hint.className = "switcher-hint";
      hint.setAttribute("role", "status");
      var parts = [];
      if (prev) parts.push('<a href="' + href(prev) + '">← ' + label(prev) + "</a>");
      parts.push('<span class="switcher-tip">' + (zh ? "左右滑动切换案例" : "Swipe to switch case") + "</span>");
      if (next) parts.push('<a href="' + href(next) + '">' + label(next) + " →</a>");
      hint.innerHTML = parts.join('<span class="switcher-sep">·</span>');
      document.body.appendChild(hint);

      var hideTimer = 0;
      function reveal(ms) {
        hint.classList.add("is-visible");
        window.clearTimeout(hideTimer);
        hideTimer = window.setTimeout(function () {
          hint.classList.remove("is-visible");
        }, ms || 2600);
      }

      var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      if (canHover) {
        document.addEventListener("mousemove", function () { reveal(); }, { passive: true });
      } else {
        window.setTimeout(function () { reveal(4200); }, 1200);
      }

      hint.addEventListener("mouseenter", function () {
        window.clearTimeout(hideTimer);
        hint.classList.add("is-visible");
      });
      hint.addEventListener("mouseleave", function () { reveal(1200); });

      function go(item) {
        if (!item) return;
        window.location.href = href(item);
      }

      // 移动端滑动
      var startX = 0;
      var startY = 0;
      var tracking = false;
      var ignored = ".echo-reel, .echo-list, .case-hero-media, .more-gallery, input, textarea, select";

      document.addEventListener("touchstart", function (event) {
        if (event.touches.length !== 1) { tracking = false; return; }
        var target = event.target;
        if (target && target.closest && target.closest(ignored)) { tracking = false; return; }
        tracking = true;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }, { passive: true });

      document.addEventListener("touchend", function (event) {
        if (!tracking) return;
        tracking = false;
        var touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return;
        var dx = touch.clientX - startX;
        var dy = touch.clientY - startY;
        if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
        if (dx < 0) { go(next); } else { go(prev); }
      }, { passive: true });

      // 桌面：方向键 + 拖动
      document.addEventListener("keydown", function (event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        var tag = (event.target && event.target.tagName) || "";
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        if (event.key === "ArrowRight") { go(next); }
        else if (event.key === "ArrowLeft") { go(prev); }
      });

      var dragStart = null;
      document.addEventListener("mousedown", function (event) {
        if (!canHover) return;
        var target = event.target;
        if (target && target.closest && target.closest(ignored)) { dragStart = null; return; }
        dragStart = event.clientX;
      });

      document.addEventListener("mouseup", function (event) {
        if (dragStart === null) return;
        var dx = event.clientX - dragStart;
        dragStart = null;
        if (Math.abs(dx) < 140) return;
        if (dx < 0) { go(next); } else { go(prev); }
      });
    })();
  </script>

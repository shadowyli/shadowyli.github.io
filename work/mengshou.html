  <style>
    /* 内容留空时让页脚落在视口底部 */
    main.case-main { min-height: calc(100vh - var(--header-height) - 180px); }
    /* 同一视觉的图与动画共用一个槽位：默认显示静图，播放时覆盖动画 */
    .case-gallery .case-media-slot {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }
    .case-gallery .case-media-slot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .case-gallery .case-media-slot video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      background: var(--surface);
      transition: opacity 240ms ease;
    }
    .case-gallery .case-media-slot.is-playing video { opacity: 1; }
    /* 手机端拿不到自动播放权限：每块动画单独给一个播放按钮（桌面靠入场/悬停自动播放，不显示按钮） */
    .case-gallery .slot-play {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      display: none;
      width: clamp(36px, 34%, 56px);
      aspect-ratio: 1;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(12, 11, 15, 0.62);
      color: #ffffff;
      cursor: pointer;
      transform: translate(-50%, -50%);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 200ms ease;
    }
    .case-gallery .slot-play svg { width: 42%; height: 42%; margin-left: 8%; }
    /* 正在播放时让出画面，播完（回到静图）再浮回来，等于「重播」入口 */
    .case-gallery .case-media-slot.is-playing .slot-play {
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 720px), (hover: none) {
      .case-gallery .slot-play { display: grid; }
    }
    /* 手机端一键播放：页面上有动画在视野里才浮出，避免常驻遮挡回声带与页脚 */
    @media (max-width: 720px) {
      .case-page .mobile-play { display: none; }
      .case-page .mobile-play.is-visible { display: inline-flex; }
      /* 给底部浮层（距底 78px + 56px 高）留出高度，页脚文字不会被压住；站点样式是 body.case-page 的同名规则，这里要同级覆盖 */
      body.case-page .case-footer { padding-bottom: 150px; }
    }
    /* 组别背景：三张一行，保持 16:9 原比例 */
    .case-gallery .case-media-grid { margin-top: 6px; }
    .case-gallery .case-media-grid--three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    /* 网格内各列必须同一水平线：抵消全局 figure + figure 的 6px 上边距 */
    .case-gallery .case-media-grid .case-frame + .case-frame { margin-top: 0; }
    /* 手机端：站内 site-wide.css 用 !important 把 figure 缝压到 4px，
       网格内单元格会被一起顶下去 4px（第 2、3 张比第 1 张低），
       网格与上图的缝也会比列缝宽 2px——这里按手机端 4px 统一回来 */
    @media (max-width: 720px) {
      .case-gallery .case-media-grid { margin-top: 4px !important; }
      .case-gallery .case-media-grid .case-frame + .case-frame { margin-top: 0 !important; }
    }
    .case-gallery .case-media-grid img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .case-body .case-credit-top {
      margin: 0 0 clamp(18px, 2.4vw, 28px);
      max-width: none;
    }
    /* 设计的回声：通栏 WebGL 展示带，中间最宽、两侧渐窄，左右边缘渐隐到底色 */
    .social-badge--long {
      white-space: normal;
      font-size: 12.5px;
      letter-spacing: 0;
      z-index: 6;
    }

    .case-body .social-sign {
      position: relative;
      z-index: 6;
      width: 100%;
      max-width: none;
      margin: 0 0 6px;
      color: #ffffff;
      font-family: "PingFangShangShangQian", var(--font-cjk);
      font-size: clamp(30px, 3.6vw, 42px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* 浅色主题下回声标题不能是白字（卡片本身是深色截图，标题跟随正文色） */
    :root[data-theme="light"] .case-body .social-sign { color: var(--text); }

    /* 回声带上方的分割线：与蛋仔案例页同款，线上下各留白（插入分隔后段间 120px 自动不再叠加） */
    .case-body .case-echo-divider {
      margin: clamp(56px, 7vw, 88px) 0 clamp(18px, 2vw, 26px);
    }

    .echo-reel {
      position: relative;
      width: 100vw;
      height: clamp(190px, 19vw, 280px);
      margin: 0 0 0 calc(50% - 50vw);
      outline: none;
    }

    .echo-reel:focus-visible .echo-canvas {
      outline: 1px solid color-mix(in srgb, var(--text) 35%, transparent);
      outline-offset: -4px;
    }

    .echo-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: grab;
      touch-action: pan-y;
      transition: opacity 700ms ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .echo-reel.is-gl .echo-canvas { opacity: 1; }
    .echo-reel.is-dragging .echo-canvas { cursor: grabbing; }

    .echo-list {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 max(20px, calc(50vw - 496px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .echo-list::-webkit-scrollbar { display: none; }

    .echo-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: none;
      height: 97%;
      margin: 0;
      scroll-snap-align: center;
    }

    .echo-card img {
      display: block;
      width: auto;
      height: calc(100% - 31px);
      max-height: calc(100% - 31px);
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 5px;
    }

    .echo-card .social-badge {
      position: static;
      order: -1;
      align-self: flex-start;
      max-width: 100%;
      margin: 0 0 6px;
      border-color: rgba(255, 255, 255, .48);
      background: rgba(8, 7, 10, .94);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      padding: 5px 11px;
      white-space: normal;
    }

    /* WebGL 接管后，DOM 列表只留给读屏与搜索引擎 */
    .echo-reel.is-gl .echo-list {
      inset: auto;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .echo-reel { height: clamp(180px, 52vw, 240px); }
      .echo-canvas {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
    }
  </style>

  <script>
    (function () {
      var bar = document.querySelector(".case-progress");
      if (!bar) return;
      var ticking = false;

      function render() {
        ticking = false;
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        bar.style.setProperty("--progress", (progress * 100).toFixed(2) + "%");
      }

      function request() {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(render);
      }

      window.addEventListener("scroll", request, { passive: true });
      window.addEventListener("resize", request);
      render();
    })();
  </script>
  <script>

      if (!trigger || !dialog) return;
      var closeButton = dialog.querySelector(".dialog-close");

      function openDialog() {
        dialog.hidden = false;
        document.body.classList.add("dialog-open");
        dialog.focus();
      }

      function closeDialog() {
        dialog.hidden = true;
        document.body.classList.remove("dialog-open");

      trigger.addEventListener("click", openDialog);

        if (event.key === "Escape" && !dialog.hidden) closeDialog();
      });
    })();

  <script>
    (function () {
      var slots = Array.prototype.slice.call(document.querySelectorAll(".case-media-slot[data-video]"));
      if (!slots.length) return;

      function attach(slot) {
        var video = slot.querySelector("video");
        var src = slot.getAttribute("data-video");
        if (!video || !src) return null;
        video.loop = false; // 只播一次：结束后停在末帧，末帧与静图一致
        if (video.getAttribute("src") !== src) {
          video.setAttribute("src", src);
          try { video.load(); } catch (error) {}
        }
        return video;
      }

      function play(slot) {
        var video = attach(slot);
        if (!video) return;
        if (!video.paused && !video.ended) return;
        try { video.currentTime = 0; } catch (error) {}
        video.muted = true;
        var promise = video.play();
        if (promise && promise.catch) promise.catch(function () {});
      }

      function stop(slot) {
        var video = slot.querySelector("video");
        if (video && !video.paused) video.pause();
        slot.classList.remove("is-playing");
      }

      var canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      slots.forEach(function (slot) {
        var video = slot.querySelector("video");
        if (!video) return;

        video.addEventListener("playing", function () {
          slot.classList.add("is-playing");
        });

        video.addEventListener("ended", function () {
          // 停在末帧淡出到静图（末帧与静图一致，不会跳回首帧）
          slot.classList.remove("is-playing");
        });

        // data-play="enter"：只跟随视口入场播放，悬停不打断静态展示
        if (canHover && slot.getAttribute("data-play") !== "enter") {
          slot.addEventListener("pointerenter", function () { play(slot); });
        }
        // 点击 = 手动重播（触屏设备没有悬停，也能重看）
        slot.addEventListener("click", function () { play(slot); });

        // 手机端：按钮直接播放这块动画（点整块也能播，按钮是给出手势入口）
        var playButton = slot.querySelector(".slot-play");
        if (playButton) {
          playButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            play(slot);
          });
        }
      });

      if (!("IntersectionObserver" in window)) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var slot = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.35) {
            if (slot.dataset.played !== "1") {
              slot.dataset.played = "1";
              play(slot);
            }
          } else if (!entry.isIntersecting) {
            delete slot.dataset.played;
            stop(slot);
          }
        });
      }, { threshold: [0, 0.35] });

      slots.forEach(function (slot) { observer.observe(slot); });

      // 手机端「一键播放」：只播当前在视野里的动画（同时解码多个会互相抢资源），
      // 按钮仅在页面上有动画时才浮出，滚到回声带/页脚前自动收起。
      var playAllButton = document.querySelector(".mobile-play");
      if (playAllButton && window.matchMedia("(max-width: 720px)").matches) {
        var visibleSlots = [];
        function syncPlayAll() {
          playAllButton.classList.toggle("is-visible", visibleSlots.length > 0);
        }
        var buttonObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var index = visibleSlots.indexOf(entry.target);
            if (entry.isIntersecting && entry.intersectionRatio >= 0.25) {
              if (index < 0) visibleSlots.push(entry.target);
            } else if (index > -1) {
              visibleSlots.splice(index, 1);
            }
          });
          syncPlayAll();
        }, { threshold: [0, 0.25] });
        slots.forEach(function (slot) { buttonObserver.observe(slot); });
        playAllButton.addEventListener("click", function () {
          visibleSlots.slice().forEach(function (slot) { play(slot); });
        });
      }
    })();
  </script>
